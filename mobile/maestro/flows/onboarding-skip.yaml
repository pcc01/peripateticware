# maestro/flows/onboarding-skip.yaml
#
# Reusable subflow — taps through the first-launch onboarding tour if it's
# currently showing. A `launchApp: { clearState: true }` now lands an
# unauthenticated device on the onboarding splash instead of straight to
# /login (AuthGuard in app/_layout.tsx routes unauthenticated + never-
# onboarded launches there — see mobile/FEATURE_PLAN.md section 3.4). This
# is a no-op if onboarding isn't visible (already onboarded this device, or
# the caller didn't clearState), so it's safe to `runFlow` unconditionally
# at the top of any flow that needs to reach /login or beyond.
appId: com.peripateticware.app
---
- runFlow:
    when:
      visible:
        id: "onboarding-splash"
    commands:
      # Each step waits on the interactive control it's about to touch, not
      # a wrapper-View testID. onboarding-name / onboarding-location /
      # onboarding-first-activity are container testIDs that surface in the
      # Android a11y tree but NOT on iOS (a testID on a plain <View> only
      # becomes an accessibilityIdentifier on iOS when the node is a leaf or
      # `accessible`), so asserting them made every iOS flow fail here. The
      # leaf controls (-input, -skip, -open, -cta) are present on both.
      - extendedWaitUntil:
          visible:
            id: "onboarding-splash-cta"
          timeout: 10000
      - tapOn:
          id: "onboarding-splash-cta"
      - extendedWaitUntil:
          visible:
            id: "onboarding-name-input"
          timeout: 15000
      - tapOn:
          id: "onboarding-name-input"
      - inputText: "Maestro Tester"
      # NOT a QuickType dismiss here (reverted — see git history): this
      # screen's own CTA button is itself labeled "Continue"
      # (src/onboarding/copy.ts's nameCta), so a "tapOn: text: Continue"
      # here matches and taps THAT real button instead of any keyboard tip,
      # advancing past this screen early and making the very next line's
      # `tapOn: id: onboarding-name-cta` fail with "element not found" (a
      # real CI run hit this 100% of the time). If QuickType interference
      # needs addressing here, it needs an id-based or more specific
      # selector that can't collide with this screen's own button text.
      - tapOn:
          id: "onboarding-name-cta"
      # Skip rather than Allow — avoids a real OS location permission
      # dialog blocking the run (see maestro/flows/capture/12.1-note-capture.yaml's
      # comment on why that dialog is worth avoiding when it isn't the point
      # of the flow).
      - extendedWaitUntil:
          visible:
            id: "onboarding-location-skip"
          timeout: 15000
      - tapOn:
          id: "onboarding-location-skip"
      - extendedWaitUntil:
          visible:
            id: "onboarding-first-activity-open"
          timeout: 15000
      - tapOn:
          id: "onboarding-first-activity-open"
      - extendedWaitUntil:
          visible:
            id: "login-screen"
          timeout: 15000
