# Mirrors e2e/settings.test.js "9.5 — switching language actually
# re-renders the THEME labels (not frozen from first load)" — a
# regression test for the bug fixed in 6fa7fe9 ("feat: wire real i18n
# into mobile (react-i18next), fix 2 reactivity bugs"). THEMES used to be
# a module-level `const` built by calling t() once at import time, so it
# never updated on a runtime language switch even though the language
# picker's own checkmark did (see 9.3's Detox test).
#
# CAVEAT (see settings.test.js's file-level comment): every locale JSON
# file currently ships byte-identical English-fallback copy, so there is
# no translated text to assert on yet. Instead this checks
# `theme-option-<name>-<lang>`, a testID built from a `renderLang` marker
# inside THEMES's own memoized array (see app/(tabs)/settings.tsx) — it
# only flips from "-en" to "-es" if THEMES actually recomputed in
# response to the language switch, which is exactly what the bug broke.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible:
    id: "theme-option-fieldGuide-en"
# The LANGUAGE control is src/components/LanguagePicker.tsx — a single
# trigger row ("🇬🇧 English ▾") that opens a modal FlatList of
# SUPPORTED_LOCALES, NOT an always-expanded inline radio list. So: scroll
# the trigger into view (it sits below THEME on Settings), open it, pick
# the Spanish row by its testID, then assert the THEME labels' renderLang
# marker flipped en -> es (the actual regression this flow guards — the
# THEMES useMemo recomputing on languageChanged).
- scrollUntilVisible:
    element:
      id: "language-picker-trigger"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: "language-picker-trigger"
- extendedWaitUntil:
    visible:
      id: "language-option-es"
    timeout: 20000
- tapOn:
    id: "language-option-es"
# modal dismisses on select; the locale download + i18n.changeLanguage()
# can take a moment on a cold locale cache, hence the generous wait.
- extendedWaitUntil:
    visible:
      id: "theme-option-fieldGuide-es"
    timeout: 35000
- assertNotVisible:
    id: "theme-option-fieldGuide-en"
- assertVisible:
    id: "settings-screen"
