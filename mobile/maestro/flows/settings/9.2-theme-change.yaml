# Mirrors e2e/settings.test.js "9.2 — changing theme selection does not
# crash and re-renders the picker".
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: a
# Maestro/XCTest accessibility-tree reliability gap after a tab switch,
# not slow rendering.
- extendedWaitUntil:
    visible: "Terrain"
    timeout: 20000
- tapOn: "Terrain"
- assertVisible:
    id: "settings-screen"
- tapOn: "Atmosphere"
- assertVisible:
    id: "settings-screen"
