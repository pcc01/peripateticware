# Mirrors e2e/settings.test.js "9.2 — changing theme selection does not
# crash and re-renders the picker".
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- tapOn: "Terrain"
- assertVisible:
    id: "settings-screen"
- tapOn: "Atmosphere"
- assertVisible:
    id: "settings-screen"
