# Mirrors e2e/settings.test.js "9.4 — Sign Out clears the session and
# returns to the login screen". Uses Maestro's `index` selector to hit the
# 2nd "Sign out" match (the native confirm-dialog's destructive button),
# same disambiguation Detox needed via `.atIndex(1)`.
#
# This flow's own failures (assertVisible login-screen at the very end)
# were never actually about the tap or the selector — a real CI run's
# screenshot at that exact failure point showed the ONBOARDING SPLASH, not
# a still-open dialog. Root cause was in app/_layout.tsx's AuthGuard: its
# `hasOnboarded` state is fetched once on mount and never refreshed, and
# (onboarding)/first-activity.tsx's finishOnboarding() updates the
# underlying flag directly via router.replace('/login') without going
# through AuthGuard at all. So AuthGuard's copy stayed stale at `false`
# for the rest of the app session — harmless until this flow's sign-out
# (the only flow that logs out from within a running session instead of
# relaunching) hit AuthGuard's `!user && !inAuth` branch, which then used
# that stale `false` and redirected to onboarding instead of login. Fixed
# at the source (AuthGuard re-reads the flag instead of trusting the
# cached copy); the tap here was fine all along.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
# scrollUntilVisible, not extendedWaitUntil, for this first tap: a real
# CI failure screenshot proved this one is a genuinely different bug from
# the Field Guide/Terrain/Español "visible but not found" mystery
# elsewhere in this suite (see 9.1/9.2/9.5's matching comments) — the
# Sign Out button is simply scrolled below the visible viewport on this
# screen (below the Theme and Language sections), not a Maestro
# accessibility-tree gap. settings.tsx's Sign Out button already has a
# correct accessibilityLabel, which is what first suggested it belonged
# with the other mystery before this screenshot separated it out.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      text: "Sign out"
      index: 1
    timeout: 20000
- tapOn:
    text: "Sign out"
    index: 1
- assertVisible:
    id: "login-screen"
