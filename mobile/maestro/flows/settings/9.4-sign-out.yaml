# Mirrors e2e/settings.test.js "9.4 — Sign Out clears the session and
# returns to the login screen".
#
# Previously used Maestro's `index` selector to hit what was assumed to be
# the 2nd "Sign out" match (the native confirm-dialog's destructive
# button), mirroring the `.atIndex(1)` disambiguation Detox needed. That
# assumed only 2 elements share the text "Sign out": this screen's own
# button and the dialog's button. There are actually 3 — settings.tsx's
# handleLogout() passes the SAME i18n key (settings.signOut.title) as both
# the Alert's title AND its destructive button label. So `index: 1` (the
# 2nd match) was landing on the dialog's TITLE text, not the button —
# tapping inert text, leaving the dialog open, which is why this
# consistently failed on every platform (not just API 30/24 as first
# guessed) at the final login-screen assertion. Anchoring on `below:` the
# confirm message ("Are you sure?", unique text) instead of a positional
# index selects the actual button regardless of how many "Sign out" texts
# exist elsewhere on screen.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
# scrollUntilVisible, not extendedWaitUntil, for this first tap: a real
# CI failure screenshot proved this one is a genuinely different bug from
# the Field Guide/Terrain/Español "visible but not found" mystery
# elsewhere in this suite (see 9.1/9.2/9.5's matching comments) — the
# Sign Out button is simply scrolled below the visible viewport on this
# screen (below the Theme and Language sections), not a Maestro
# accessibility-tree gap. settings.tsx's Sign Out button already has a
# correct accessibilityLabel, which is what first suggested it belonged
# with the other mystery before this screenshot separated it out.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Are you sure?"
    timeout: 20000
- tapOn:
    text: "Sign out"
    below: "Are you sure?"
- assertVisible:
    id: "login-screen"
