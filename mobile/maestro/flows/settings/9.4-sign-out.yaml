# Mirrors e2e/settings.test.js "9.4 — Sign Out clears the session and
# returns to the login screen". Uses Maestro's `index` selector to hit the
# 2nd "Sign out" match (the native confirm-dialog's destructive button),
# same disambiguation Detox needed via `.atIndex(1)`.
#
# Session 18's full-matrix run found this failing on API 30/24 only. Using
# extendedWaitUntil (20s) instead of plain assertVisible (default 7s) for
# the dialog button, matching the timeout bump made in settings.test.js's
# equivalent — worth trying, not confirmed to be the whole story (could
# also be a button-order/render-tree difference across Android versions;
# needs a real run on those devices either way).
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
# scrollUntilVisible, not extendedWaitUntil, for this first tap: a real
# CI failure screenshot proved this one is a genuinely different bug from
# the Field Guide/Terrain/Español "visible but not found" mystery
# elsewhere in this suite (see 9.1/9.2/9.5's matching comments) — the
# Sign Out button is simply scrolled below the visible viewport on this
# screen (below the Theme and Language sections), not a Maestro
# accessibility-tree gap. settings.tsx's Sign Out button already has a
# correct accessibilityLabel, which is what first suggested it belonged
# with the other mystery before this screenshot separated it out.
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible:
      text: "Sign out"
      index: 1
    timeout: 20000
- tapOn:
    text: "Sign out"
    index: 1
- assertVisible:
    id: "login-screen"
