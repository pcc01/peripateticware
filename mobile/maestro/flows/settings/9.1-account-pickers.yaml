# Mirrors e2e/settings.test.js "9.1 — shows account email and the
# theme picker". Same testIDs/text as the Detox version.
# NOTE: the age-band picker (K-6/7-12/College) was removed — see
# mobile/FEATURE_PLAN.md section 1 — so those assertions were dropped.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible: "${STUDENT_EMAIL}"
- assertVisible: "Field Guide"
- assertVisible: "Terrain"
- assertVisible: "Atmosphere"
