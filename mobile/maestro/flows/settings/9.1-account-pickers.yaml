# Mirrors e2e/settings.test.js "9.1 — shows account email and the
# theme picker". Same testIDs/text as the Detox version.
# NOTE: the age-band picker (K-6/7-12/College) was removed — see
# mobile/FEATURE_PLAN.md section 1 — so those assertions were dropped.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible: "${STUDENT_EMAIL}"
# Wildcarded `.*Field Guide.*` etc, not a bare exact match — the actual
# root cause (found via screenshot: the text IS visible immediately, so
# a longer extendedWaitUntil timeout never helped, despite looking like
# the same class of bug as maestro/flows/activity/4-6-activity-flow.yaml's
# post-transition timing issue). settings.tsx's theme options carry
# accessibilityRole="radio" + an explicit combined accessibilityLabel
# ("Field Guide theme. Warm parchment — classic field notebook", not
# just "Field Guide") — once a radio element has its own label, iOS's
# accessibility tree stops separately exposing its nested Text children,
# so the only queryable node here is the FULL combined label. Maestro's
# plain-text match is a full-string regex, not a substring search (see
# maestro/flows/discover/3-discover-screen.yaml's matching comment), so
# a bare "Field Guide" never matched "Field Guide theme. ...".
- extendedWaitUntil:
    visible: ".*Field Guide.*"
    timeout: 20000
- assertVisible: ".*Terrain.*"
- assertVisible: ".*Atmosphere.*"
