# Mirrors e2e/settings.test.js "9.1 — shows account email and the
# theme picker". Same testIDs/text as the Detox version.
# NOTE: the age-band picker (K-6/7-12/College) was removed — see
# mobile/FEATURE_PLAN.md section 1 — so those assertions were dropped.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"
- assertVisible: "${STUDENT_EMAIL}"
# extendedWaitUntil, not plain assertVisible — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: a
# Maestro/XCTest accessibility-tree reliability gap after a tab switch,
# not slow rendering (this same "Field Guide"/"Terrain" pair timed out
# in a real CI run despite the screen's own testID and the email text
# right above them asserting fine).
- extendedWaitUntil:
    visible: "Field Guide"
    timeout: 20000
- assertVisible: "Terrain"
- assertVisible: "Atmosphere"
