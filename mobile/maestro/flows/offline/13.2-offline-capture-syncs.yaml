# Covers MANUAL_TESTING_GUIDE.md section 5E.2 ("Re-enable WiFi -> Queued
# capture auto-uploads"). Companion to 13.1-offline-capture-queued.yaml —
# run AFTER that flow, and after scripts/run-offline-capture-test.ps1 has
# re-enabled the network (`adb shell svc wifi enable` / `svc data enable`).
#
# Known limitation, documented rather than papered over: there is currently
# no UI-visible "synced" / "pending" indicator anywhere in the app (checked
# app/(tabs)/journal.tsx — capture entries carry no sync-status testID or
# text). src/hooks/useConnectivity.ts's flushQueue() call on reconnect only
# logs to the console ("✅ Synced N items"), nothing renders. So this flow
# can only assert the WEAKER thing: that reconnecting and relaunching
# doesn't crash or error, not that the specific queued note from 13.1
# actually made it to the server. Confirming the strong version would need
# either (a) a real sync-status indicator added to the Journal UI — worth
# doing anyway, see the feature plan for why — or (b) a direct backend
# check (GET the capture by the queue id and confirm it exists server-side)
# added to the wrapper script outside Maestro. Flagging this rather than
# writing an assertion that looks stronger than it actually is.
#
# useConnectivity polls every 15s (see the `setInterval(check, 15_000)`),
# so the wrapper script waits at least that long after re-enabling the
# network before running this flow.
# Two platform-gated launchApp blocks, not one `${LOCATION_PERMISSION}`
# value — see 12.1-note-capture.yaml header: env substitution doesn't reach
# launchApp's permissions map on iOS.
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: false
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: false
          permissions:
            location: inuse
# Not `runFlow: ../login-student.yaml` — that subflow's first step asserts
# login-screen is visible, which assumes we're starting logged out. This
# flow launches with `clearState: false` specifically to keep the session
# 13.1 already created, so the app restores that session on launch and
# AuthGuard (app/_layout.tsx) redirects straight past login into (tabs) —
# login-screen never appears, which is exactly why this flow was failing
# immediately ("Assertion is false: id: login-screen is visible") before
# ever reaching the offline-sync assertions below. Mirrors how
# auth/1.6-persist-session.yaml (relaunch after login, clearState: false)
# asserts discover-screen directly instead of re-running the login flow.
- assertVisible:
    id: "discover-screen"
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"

# Weak-but-real assertion: app is fully functional post-reconnect, no crash
# or stuck error state after the queue-flush ran in the background.
# "Back" first — activity/[id].tsx's activity-screen has no tab bar (it's
# a detail view pushed on top of (tabs)), confirmed via a real CI
# screenshot showing tab-journal simply not present on that screen. id, not
# text, now that the back button has testID="activity-back-btn" (see
# maestro/flows/discover/3-discover-screen.yaml's matching comment for why
# text matching it was fragile to begin with).
- tapOn:
    id: "activity-back-btn"
- tapOn:
    id: "tab-journal"
- assertVisible:
    id: "journal-screen"
- tapOn:
    id: "tab-progress"
- assertVisible:
    id: "progress-screen"
