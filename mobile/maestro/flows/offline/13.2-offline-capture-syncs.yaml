# UPDATED 2026-09-14 (age-scoped-consent / explicit-sync redesign):
# reconnecting no longer auto-uploads anything — useConnectivity.ts's
# flushQueue()-on-reconnect call was removed, along with the opportunistic
# flush in CaptureSheet.tsx and the flush-on-launch in appInit.ts. Nothing
# leaves the device except an explicit "Save to Server" (Inquiry phase) or
# Save Draft/Submit (Reflect phase) action — see the age-scoped-consent plan
# doc's "Local capture is never gated" section for why. This flow's original
# premise (MANUAL_TESTING_GUIDE.md section 5E.2, "Re-enable WiFi -> Queued
# capture auto-uploads") is therefore no longer how the app behaves; kept as
# a plain "reconnecting and relaunching doesn't crash" smoke check (which is
# still real and worth having), not a sync-behavior assertion. A real
# capture-sync test now needs to drive the explicit Save-to-Server button
# instead of just waiting for reconnect.
#
# Companion to 13.1-offline-capture-queued.yaml — run AFTER that flow, and
# after scripts/run-offline-capture-test.ps1 has re-enabled the network
# (`adb shell svc wifi enable` / `svc data enable`).
# Two platform-gated launchApp blocks, not one `${LOCATION_PERMISSION}`
# value — see 12.1-note-capture.yaml header: env substitution doesn't reach
# launchApp's permissions map on iOS.
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: false
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: false
          permissions:
            location: inuse
# Not `runFlow: ../login-student.yaml` — that subflow's first step asserts
# login-screen is visible, which assumes we're starting logged out. This
# flow launches with `clearState: false` specifically to keep the session
# 13.1 already created, so the app restores that session on launch and
# AuthGuard (app/_layout.tsx) redirects straight past login into (tabs) —
# login-screen never appears, which is exactly why this flow was failing
# immediately ("Assertion is false: id: login-screen is visible") before
# ever reaching the offline-sync assertions below. Mirrors how
# auth/1.6-persist-session.yaml (relaunch after login, clearState: false)
# asserts discover-screen directly instead of re-running the login flow.
- assertVisible:
    id: "discover-screen"
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"

# Weak-but-real assertion: app is fully functional post-reconnect, no crash
# or stuck error state after the queue-flush ran in the background.
# "Back" first — activity/[id].tsx's activity-screen has no tab bar (it's
# a detail view pushed on top of (tabs)), confirmed via a real CI
# screenshot showing tab-journal simply not present on that screen. id, not
# text, now that the back button has testID="activity-back-btn" (see
# maestro/flows/discover/3-discover-screen.yaml's matching comment for why
# text matching it was fragile to begin with).
- tapOn:
    id: "activity-back-btn"
- tapOn:
    id: "tab-journal"
- assertVisible:
    id: "journal-screen"
- tapOn:
    id: "tab-progress"
- assertVisible:
    id: "progress-screen"
