# Covers MANUAL_TESTING_GUIDE.md section 5E.1 ("Disable WiFi, take a photo ->
# Capture is queued (no error crash)") — the one item the original Detox
# suite explicitly skipped (see e2e/discover.test.js's "SKIPPED: 3.2/3.3"
# comment) because Detox has no reliable way to toggle real OS network
# state. Maestro doesn't either, from inside a YAML flow — but it shells
# out through adb like everything else in this project's tooling, so the
# network toggle happens OUTSIDE this file, via adb, in
# scripts/run-offline-capture-test.ps1, which wraps this flow with
# `adb shell svc wifi disable` / `svc data disable` before running it.
# Do not run this flow standalone expecting it to go offline itself — the
# network needs to actually be cut first for this to be a meaningful test.
#
# CaptureSheet.tsx's upload() always saves to the device first regardless of
# connectivity (a field activity can't assume signal) — there is no more
# separate online/offline branch or offline-specific UI to distinguish; the
# confirmation shown is identical either way, by design. This flow therefore
# doesn't assert anything offline-specific — it just proves capturing with
# no network doesn't error or hang, which is still worth a dedicated,
# network-cut CI run (as opposed to the always-online 12.1-note-capture.yaml
# exercising the identical code path). Uses note capture (not photo) to keep
# this deterministic and fast — no camera/mic permission dance.
# Two platform-gated launchApp blocks, not one `${LOCATION_PERMISSION}`
# value — see 12.1-note-capture.yaml header: env substitution doesn't reach
# launchApp's permissions map on iOS.
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# Optional dismiss for the OS location dialog — see 12.1-note-capture.yaml
# header: the permissions pre-grant doesn't reliably suppress it, and a real
# CI run screenshotted it covering "Observe & Capture".
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-note"
- assertVisible:
    id: "capture-sheet"
- tapOn:
    id: "capture-note-input"
- inputText: "Queued while offline — should upload once reconnected."
# See 12.1-note-capture.yaml's matching comment: iOS's built-in QuickType
# "slide to type" tip appears the first time a keyboard shows on a fresh
# install and can eat the tap meant for the save button. Not currently
# exercised on iOS CI (offline/ is excluded from that sweep — see the CI
# workflow's comment) but kept consistent for local/future iOS runs.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "capture-note-save"
# Same confirmation as the always-online 12.1 flow — proves the local save
# (queueCapture()) succeeded with zero network involved, which is the whole
# point here; there's no separate offline-branch UI left to assert.
- assertVisible:
    id: "capture-saved-confirmation"
- extendedWaitUntil:
    notVisible:
      id: "capture-sheet"
    timeout: 20000
- assertVisible:
    id: "activity-screen"
