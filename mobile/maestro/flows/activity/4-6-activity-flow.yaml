# Mirrors e2e/activity-flow.test.js "Activity Flow (Brief -> Orient ->
# Inquiry -> Reflect -> Submit)" — combines MANUAL_TESTING_GUIDE.md sections
# 4 and 6, same as the Detox version, since both walk the same
# app/activity/[id].tsx screen through its phases in one continuous,
# stateful session (beforeAll + sequential it() blocks, not independent
# tests).
#
# 4.7 ("Ask Peri responds") is exercised only up to sending the message —
# asserting on the actual AI reply text would require Ollama running on the
# host, not guaranteed in CI. Same limitation the Detox version flagged.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn (default ~17s timeout, and even that
# wasn't enough): a real CI run's on-screen diagnostic proved the activity
# list data loads and renders correctly well within that window (confirmed
# via a debug indicator + the failure screenshot showing "Creek Habitat
# Study" plainly visible) — this is a Maestro/XCTest accessibility-tree
# query reliability gap after the Discover tab first mounts post-login,
# not an app bug. Same root cause suspected behind 9.1/9.2/9.4/9.5's
# similarly-timed-out "visible but not found" failures elsewhere in this
# suite (confirmed NOT an accessibilityLabel issue either — settings.tsx's
# Sign Out button already has one and still failed the same way).
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"

# 4.1 — Brief phase shows title, description, and the start CTA
- assertVisible: "Creek Habitat Study"
- assertVisible: "I'm ready — let's go"

# 4.2/4.3 — advances Brief -> Orient
- tapOn: "I'm ready — let's go"
- assertVisible: "Arrive & Observe"
- assertVisible: "I'm oriented — begin inquiry"

# 4.4/4.5 — advances Orient -> Inquiry, showing the question + capture row
#
# Uses extendedWaitUntil (not plain assertVisible, default timeout 7s) —
# this specific assertion is the one that failed on API 24
# (Nexus_5X, the oldest/least-accelerated device in the matrix) in Session
# 18's full-matrix run, and passed everywhere else. The phase transition
# itself (setPhase('inquiry') in app/activity/[id].tsx) isn't gated on
# anything async — this is a render/re-paint speed hypothesis, not a
# confirmed root cause; needs a real run on that device to confirm this
# actually fixes it rather than just theoretically explaining it.
- tapOn: "I'm oriented — begin inquiry"
- extendedWaitUntil:
    visible: "Observe & Capture"
    timeout: 20000

# 4.6/4.7/4.8 — opens Ask Peri, sends a message, and dismisses the sheet
- tapOn: "💬 Ask Peri"
- assertVisible:
    id: "peri-chat-sheet"
- assertVisible: "I'm Peri. Ask me anything about the activity or what you're observing."
- tapOn:
    id: "peri-chat-input"
- inputText: "What insects live near a creek?"
- tapOn:
    id: "peri-chat-send"
- assertVisible: "What insects live near a creek?"
- tapOn:
    id: "peri-chat-close"
- assertNotVisible:
    id: "peri-chat-sheet"

# 6.1-6.4 — advances Inquiry -> Reflect, submits, and returns to Discover
- tapOn: "Done capturing — reflect"
- assertVisible: "Make Meaning"
- tapOn:
    id: "reflection-input"
- inputText: "The creek water was clearer than I expected."
- tapOn: "Submit field work"
- assertVisible: "Submitted! 🎉"
- tapOn: "Done"
- assertVisible:
    id: "discover-screen"
