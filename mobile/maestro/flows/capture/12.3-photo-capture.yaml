# New coverage — see 12.1-note-capture.yaml header for context.
#
# Photo capture now stays fully in-app (src/components/InAppCamera.tsx,
# wrapping expo-camera's CameraView) instead of handing off to the OS
# system Camera app, specifically so it has real testIDs and is
# automatable here — that in-app-camera rebuild happened in this same
# session, together with this flow. First use of expo-camera and of the
# `permissions.camera: allow` grant in this suite; the emulator's virtual
# camera produces a synthetic test-pattern image, which is fine for
# exercising the capture pipeline but isn't a real photo.
# permissions.location — Inquiry phase triggers a geofence
# location-permission dialog regardless of what the test is actually
# about; see 12.1-note-capture.yaml header for how this was found, and for
# why it's two platform-gated launchApp blocks rather than one
# `${LOCATION_PERMISSION}` value (env substitution doesn't reach
# launchApp's permissions map on iOS).
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            location: inuse
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# Optional dismiss for the OS location dialog — see 12.1-note-capture.yaml
# header: the permissions pre-grant doesn't reliably suppress it, and a real
# CI run screenshotted it covering "Observe & Capture".
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-photo"
- assertVisible:
    id: "capture-sheet"
- assertVisible:
    id: "in-app-camera"
# camera-shutter only renders once InAppCamera's onCameraReady fires (see
# the component's `!ready` gate). Plain tapOn's implicit wait for an
# element to exist is Maestro's default command timeout (~7s) — not
# unlimited — and a real CI screenshot caught the iOS simulator still
# showing "Starting camera…" well past that. extendedWaitUntil (20s) plus
# a separate tapOn instead of relying on tapOn's own wait.
- extendedWaitUntil:
    visible:
      id: "camera-shutter"
    timeout: 20000
- tapOn:
    id: "camera-shutter"
# Captures always save to the device first (never a direct upload call —
# see CaptureSheet.tsx's upload()), so this confirmation shows immediately;
# the sheet then auto-closes ~900ms later.
- assertVisible:
    id: "capture-saved-confirmation"
- extendedWaitUntil:
    notVisible:
      id: "capture-sheet"
    timeout: 20000
- assertVisible:
    id: "activity-screen"
