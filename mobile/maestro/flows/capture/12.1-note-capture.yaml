# New coverage (not in the original Detox suite — capture wasn't wired to
# the UI when that suite was written; app/activity/[id].tsx's capture row
# just showed an Alert.alert('Coming soon', ...) stub). Wired up and tested
# together in this session: src/components/CaptureSheet.tsx (photo/audio/
# note/video mode picker) is now reachable via the real capture-btn-*
# buttons instead of the stub.
#
# capture-btn-note now opens straight into the note screen (CaptureSheet's
# `initialMode` prop) instead of landing on the generic mode picker first —
# each outer button used to call the same onCapture() handler regardless of
# which icon was tapped, so every one of them (including the pencil) opened
# the identical 4-icon picker and made you choose again. No more
# `capture-mode-note` tap in between.
#
# permissions.location — every flow that reaches the Inquiry phase (not
# just the geofence flow) triggers useGeofence's location permission
# request, which pops a blocking native dialog if not pre-granted. Found
# this the hard way: without it, this flow (and 12.2/12.4) failed with the
# OS location dialog covering the screen and eating taps meant for the app.
# Two platform-specific launchApp blocks, not one `${LOCATION_PERMISSION}`
# value: Android's location permission is a plain allow/deny, but iOS's is
# granular (always/inuse/never/unset) and rejects "allow" outright (see
# maestro#1458) — so far so parameterizable. But a real CI run proved `-e`
# substitution itself doesn't happen inside launchApp's permissions map on
# iOS (it reached the device as the literal string "${LOCATION_PERMISSION}",
# failing permission validation), while the same substitution works fine
# there on Android. Hence two literal blocks gated by `when: platform`
# instead of one interpolated value.
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            location: inuse
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# A real CI run screenshotted the OS location dialog ("Allow Peripateticware
# to access this device's location?") sitting on top of "Observe & Capture",
# fully obscuring it from the accessibility tree Maestro queries — the
# Android permissions pre-grant above doesn't reliably suppress this
# specific dialog, so useGeofence's requestForegroundPermissionsAsync()
# (fired on entering Inquiry) still shows it. optional: true so this is a
# no-op on runs where the dialog doesn't appear.
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-note"
- assertVisible:
    id: "capture-sheet"
- tapOn:
    id: "capture-note-input"
- inputText: "Found three different leaf shapes near the water."
# iOS shows its built-in "Speed up your typing by sliding your finger
# across the letters" QuickType tip the first time a keyboard appears on a
# fresh install — every run here, since launchApp above always
# clearState: true. A real CI screenshot caught it covering the save
# button at exactly this point, eating the tap and leaving the sheet open
# (the reported failure was "capture-sheet is not visible" further down).
# Its own dismiss control is this "Continue" link; optional since it never
# appears on Android.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "capture-note-save"
- assertVisible:
    id: "capture-saved-confirmation"
# Captures always save to the device first (never a direct upload call —
# see CaptureSheet.tsx's upload()), so this confirmation shows immediately;
# the sheet then auto-closes ~900ms later. extendedWaitUntil (not plain
# assertNotVisible's default ~7s) is generous headroom for that fixed delay
# plus whatever animation/accessibility-tree lag Maestro needs, matching the
# other timing-sensitive waits in this suite.
- extendedWaitUntil:
    notVisible:
      id: "capture-sheet"
    timeout: 20000
- assertVisible:
    id: "activity-screen"
