# New coverage — see 12.1-note-capture.yaml header for context on why this
# wasn't testable before this session, why permissions.location is required
# here too (Inquiry phase triggers a geofence location-permission dialog
# regardless of what the test is actually about), and why it's two
# platform-gated launchApp blocks rather than one `${LOCATION_PERMISSION}`
# value (env substitution doesn't reach launchApp's permissions map on iOS).
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            microphone: allow
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            microphone: allow
            location: inuse
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# Optional dismiss for the OS location dialog — see 12.1-note-capture.yaml
# header: the permissions pre-grant doesn't reliably suppress it, and a real
# CI run screenshotted it covering "Observe & Capture".
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-audio"
- assertVisible:
    id: "capture-sheet"
- tapOn:
    id: "capture-mode-audio"
- tapOn:
    id: "capture-record-btn"
- assertVisible: ".*Recording.*tap to stop.*"
- tapOn:
    id: "capture-record-btn"
- assertNotVisible:
    id: "capture-sheet"
- assertVisible:
    id: "activity-screen"
