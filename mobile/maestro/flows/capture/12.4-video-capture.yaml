# New coverage — see 12.1-note-capture.yaml and 12.3-photo-capture.yaml
# headers for context. Video capture didn't exist anywhere in the app
# before this session — src/components/InAppCamera.tsx and the 'video'
# CaptureMode in CaptureSheet.tsx were both built from scratch here, backed
# by expo-camera's CameraView.recordAsync()/stopRecording(). Backend
# already supported "video" as a capture_type (backend/models/database.py
# CaptureType enum), so no backend change was needed.
# permissions.location — Inquiry phase triggers a geofence
# location-permission dialog regardless of what the test is actually about;
# see 12.1-note-capture.yaml header for why it's two platform-gated
# launchApp blocks rather than one `${LOCATION_PERMISSION}` value (env
# substitution doesn't reach launchApp's permissions map on iOS).
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            microphone: allow
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            microphone: allow
            location: inuse
- runFlow: ../login-student.yaml
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# Optional dismiss for the OS location dialog — see 12.1-note-capture.yaml
# header: the permissions pre-grant doesn't reliably suppress it, and a real
# CI run screenshotted it covering "Observe & Capture".
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-video"
- assertVisible:
    id: "capture-sheet"
- tapOn:
    id: "capture-mode-video"
- assertVisible:
    id: "in-app-camera"
- tapOn:
    id: "camera-record"
- assertVisible: ".*Recording.*tap to stop.*"
- tapOn:
    id: "camera-record"
- assertNotVisible:
    id: "capture-sheet"
- assertVisible:
    id: "activity-screen"
