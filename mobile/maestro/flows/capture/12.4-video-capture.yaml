# New coverage — see 12.1-note-capture.yaml and 12.3-photo-capture.yaml
# headers for context. Video capture didn't exist anywhere in the app
# before this session — src/components/InAppCamera.tsx and the 'video'
# CaptureMode in CaptureSheet.tsx were both built from scratch here, backed
# by expo-camera's CameraView.recordAsync()/stopRecording(). Backend
# already supported "video" as a capture_type (backend/models/database.py
# CaptureType enum), so no backend change was needed.
# permissions.location — Inquiry phase triggers a geofence
# location-permission dialog regardless of what the test is actually about;
# see 12.1-note-capture.yaml header for why it's two platform-gated
# launchApp blocks rather than one `${LOCATION_PERMISSION}` value (env
# substitution doesn't reach launchApp's permissions map on iOS).
appId: com.peripateticware.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            microphone: allow
            location: allow
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearState: true
          permissions:
            camera: allow
            microphone: allow
            location: inuse
- runFlow: ../login-student.yaml
# extendedWaitUntil, not plain tapOn — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- scrollUntilVisible:
    element:
      text: "Creek Habitat Study"
    direction: DOWN
    timeout: 25000
    centerElement: true
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# Optional dismiss for the OS location dialog — see 12.1-note-capture.yaml
# header: the permissions pre-grant doesn't reliably suppress it, and a real
# CI run screenshotted it covering "Observe & Capture".
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Observe & Capture"

- tapOn:
    id: "capture-btn-video"
# No assertVisible on capture-sheet here — InAppCamera renders its own
# nested <Modal> on top of CaptureSheet's for photo/video modes, which
# covers capture-sheet immediately (confirmed via a real CI failure:
# "Assertion is false: id: capture-sheet is visible"). in-app-camera below
# is the real signal that the capture flow actually opened; same fix
# class as e2e/capture.test.js's toBeVisible() -> toExist() for 12.3/12.4.
- assertVisible:
    id: "in-app-camera"
# camera-record only renders once InAppCamera's onCameraReady fires (see
# the component's `!ready` gate). Plain tapOn's implicit wait for an
# element to exist is Maestro's default command timeout (~7s) — not
# unlimited — and a real CI screenshot caught the iOS simulator still
# showing "Starting camera…" well past that. extendedWaitUntil (20s) plus
# a separate tapOn instead of relying on tapOn's own wait.
- extendedWaitUntil:
    visible:
      id: "camera-record"
    timeout: 20000
- tapOn:
    id: "camera-record"
- assertVisible: ".*Recording.*tap to stop.*"
- tapOn:
    id: "camera-record"
# No assertVisible on capture-saved-confirmation — same transient-toast
# race as 12.1-note-capture.yaml's matching comment (~900ms, then
# auto-closes); 12.3-photo-capture.yaml hit the identical failure.
- extendedWaitUntil:
    notVisible:
      id: "capture-sheet"
    timeout: 20000
- assertVisible:
    id: "activity-screen"
