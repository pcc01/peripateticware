# New coverage for the speaker/read-aloud button added to PeriSpeech
# (src/components/PeriSpeech.tsx) — see mobile/FEATURE_PLAN.md section 3.2/3.3.
#
# Uses the login screen because PeriSpeech renders there before any auth is
# needed, keeping this flow independent of seeded test credentials.
#
# Maestro can assert the button exists, is tappable, and that its visible
# state flips (icon swaps between the "speak" and "playing" glyphs, per
# `speaking` state in useSpeech) — it can't assert that audio actually
# played on-device. Same class of limitation already documented for the
# AI-reply-text gap in the PeriChat flows.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../onboarding-skip.yaml
- assertVisible:
    id: "login-screen"
- assertVisible:
    id: "peri-speech-speaker"
- tapOn:
    id: "peri-speech-speaker"
# Text, not the ⏸/🔊 glyphs — a real CI failure's captured accessibility
# hierarchy showed this element's accessibilityText tracking
# PeriSpeech.tsx's `speaking` state via the accessibilityLabel prop
# ("Read aloud" / "Stop reading aloud"), not the icon glyph: the glyph is
# rendered in a plain <Text> child, invisible to the accessibility tree once
# the parent has its own explicit accessibilityLabel. Same class of gap as
# "Ask Peri" in maestro/flows/activity/4-6-activity-flow.yaml. Matching on
# the real accessible label instead — icon swaps to the "playing" state
# while speaking.
- extendedWaitUntil:
    visible: "Stop reading aloud"
    timeout: 20000
- tapOn:
    id: "peri-speech-speaker"
# Tapping again stops playback — label swaps back.
- extendedWaitUntil:
    visible: "Read aloud"
    timeout: 20000
