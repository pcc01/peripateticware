# maestro/flows/login-student.yaml
#
# Reusable login subflow — mirrors e2e/helpers.js::loginAsStudent().
# Uses the SAME testIDs the Detox suite already relies on (login-screen,
# email-input, password-input, discover-screen), since React Native's
# `testID` prop compiles down to a native resource-id / accessibility
# identifier that both Detox and Maestro read the same way. No app code
# changes needed to run this.
#
# Credentials are passed in via `maestro test -e STUDENT_EMAIL=... -e
# STUDENT_PASSWORD=...` (see the seeded test account in mobile/.env.test /
# backend/startup.py::seed_test_accounts).
#
# Taps through onboarding first if it's showing (no-op otherwise) — a
# `clearState: true` launch now lands on the onboarding tour instead of
# /login directly. See onboarding-skip.yaml.
appId: com.peripateticware.app
---
- runFlow: ./onboarding-skip.yaml
- assertVisible:
    id: "login-screen"
- tapOn:
    id: "email-input"
- inputText: "${STUDENT_EMAIL}"
# Belt-and-suspenders, not the primary fix — see onboarding-skip.yaml's own
# comment: iOS's QuickType tip most likely already showed and got dismissed
# there (the actual first keyboard appearance on a fresh install, since
# onboarding-skip runs before this file's own fields do). Kept here too in
# case it persists across the onboarding -> login transition or the
# secure-text keyboard for the password field triggers its own instance —
# a real CI screenshot caught this exact symptom (Sign In's "Missing
# fields" alert, meaning one or both fields were empty at submit).
# optional: true since it never appears on Android.
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    id: "password-input"
- inputText: "${STUDENT_PASSWORD}"
- tapOn:
    text: "Continue"
    optional: true
- tapOn: "Sign in"
- assertVisible:
    id: "discover-screen"
