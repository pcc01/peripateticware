# Mirrors e2e/geofence.test.js "Geofence (Location-Based Guard)". Uses
# "Creek Habitat Study" (location_latitude=37.8716, location_longitude=
# -122.2727, location_radius_meters=500 — backend/startup.py seed default).
#
# FIRST USE of Maestro's setLocation/permissions commands in this suite —
# same caveat the Detox version flagged: the `permissions.location` grant
# must actually take on the device for
# src/hooks/useGeofence.ts's requestForegroundPermissionsAsync() to
# succeed, or the watcher never starts and the geofence-toast assertions
# below will time out. Verify on-device before trusting this in CI.
# ${LOCATION_PERMISSION}, not a literal value: Android's location
# permission is a plain allow/deny, but iOS's is granular (always/inuse/
# never/unset) and rejects "allow" outright (see maestro#1458). Each
# platform's CI job passes the right value via `-e LOCATION_PERMISSION=...`.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
    permissions:
      location: ${LOCATION_PERMISSION}
- setLocation:
    latitude: 37.8716
    longitude: -122.2727
- runFlow: ../login-student.yaml
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- tapOn: "I'm ready — let's go"
- tapOn: "I'm oriented — begin inquiry"
# extendedWaitUntil, not plain assertVisible (default 7s timeout) — see the
# same assertion in maestro/flows/activity/4-6-activity-flow.yaml for why:
# this specific point failed on API 24 in Session 18's run.
- extendedWaitUntil:
    visible: "Observe & Capture"
    timeout: 20000

# 10.1 — no warning while inside the activity radius
- setLocation:
    latitude: 37.8716
    longitude: -122.2727
- assertNotVisible:
    id: "geofence-toast"

# 10.2/10.3 — shows a non-blocking toast when the student leaves the radius
#
# extendedWaitUntil here too — this was the other API-24-only failure in
# Session 18's run. src/hooks/useGeofence.ts relies on
# Location.watchPositionAsync's callback firing after setLocation changes
# the mocked position; that callback's latency depends on the emulator's
# location-provider implementation, which plausibly varies more on
# Android 7.0/API 24 (oldest, least-accelerated device) than newer ones.
# Hypothesis, not confirmed — needs a real run on that device to verify.
- setLocation:
    latitude: 37.95
    longitude: -122.35
- extendedWaitUntil:
    visible:
      id: "geofence-toast"
    timeout: 20000
- assertVisible: "Done capturing — reflect"
