# Mirrors e2e/navigation.test.js "Navigation (Bottom Tab Bar)" (2.1-2.4,
# 2.5 — combined into one flow since the original Detox file runs them
# sequentially in a single session via beforeAll).
#
# app/(tabs)/_layout.tsx registers 5 <Tabs.Screen> entries (index/journal/
# propose/progress/settings) plus the hidden explore.tsx redirect stub
# (href: null, kept "to avoid broken imports" per its own comment — expo-
# router auto-registers any file under (tabs)/ as a tab unless explicitly
# hidden this way). 2.5 below asserts all 5 real tabs are visible and the
# hidden "explore" stub is not.
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml

# 2.1-2.4 — taps each of the 5 tabs and shows the matching screen
- tapOn:
    id: "tab-discover"
- assertVisible:
    id: "discover-screen"
- tapOn:
    id: "tab-journal"
- assertVisible:
    id: "journal-screen"
- tapOn:
    id: "tab-propose"
- assertVisible:
    id: "propose-screen"
- tapOn:
    id: "tab-progress"
- assertVisible:
    id: "progress-screen"
- tapOn:
    id: "tab-settings"
- assertVisible:
    id: "settings-screen"

# 2.5 — only the 5 registered tabs are visible, no extra "Explore" tab
- assertVisible:
    id: "tab-discover"
- assertVisible:
    id: "tab-journal"
- assertVisible:
    id: "tab-propose"
- assertVisible:
    id: "tab-progress"
- assertVisible:
    id: "tab-settings"
- assertNotVisible:
    id: "tab-explore"
- assertNotVisible: "Explore"
