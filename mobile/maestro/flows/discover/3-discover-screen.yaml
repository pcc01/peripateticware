# Mirrors e2e/discover.test.js "Discover Screen" (3.4, 3.1, 3.5 — combined
# into one flow since the original Detox file runs them sequentially in a
# single session via beforeAll).
#
# SKIPPED: 3.2/3.3 (disable/re-enable device WiFi -> offline banner). No
# offline-mode mock exists in the app (src/hooks/useConnectivity.ts reads
# real OS network state), and toggling real device WiFi isn't something
# Maestro's standard command set does either. Same gap the Detox version
# flagged.
#
# First use of `swipe` in this Maestro suite (pull-to-refresh) — verify the
# gesture actually triggers RefreshControl on-device.
#
# The location line has its own testID (activity-location) rather than
# being matched by text — a previous version of this flow tried both a
# bare "Local creek or drainage channel" match and a wildcarded
# ".*Local creek or drainage channel.*" one. Both were built on a false
# premise: ActivityCard's outer TouchableOpacity has its own explicit
# accessibilityLabel (app/(tabs)/index.tsx), which on iOS makes the whole
# card ONE accessibility node reporting just that label — the location
# Text's own content was never separately exposed to the tree Maestro
# queries, wildcarding or not, so no text-based match on it could ever
# succeed. A testID sidesteps this: Maestro's id selector matches on
# accessibilityIdentifier directly, independent of how accessibilityLabel
# grouping affects what text a VoiceOver-style query sees. (An earlier
# attempt fixed this by folding subject/duration/location into the card's
# accessibilityLabel instead of adding a testID — don't repeat that; it's
# a real accessibility win in isolation, but it silently broke every OTHER
# flow's exact "Creek Habitat Study" match, since that's a full-string,
# not substring, match against whatever the label now was. Confirmed 100%
# reproducible across 4 real CI runs, in both directions, before landing
# on this fix.)
appId: com.peripateticware.app
---
- launchApp:
    clearState: true
- runFlow: ../login-student.yaml

# 3.4 — activity cards show title, subject/duration, and location
#
# extendedWaitUntil, not plain assertVisible — see
# maestro/flows/activity/4-6-activity-flow.yaml's matching comment: this
# is a Maestro/XCTest accessibility-tree reliability gap after the
# Discover tab mounts post-login, not slow data loading.
- extendedWaitUntil:
    visible: "Creek Habitat Study"
    timeout: 20000
# id, not text — see this file's header comment.
- assertVisible:
    id: "activity-location"

# 3.1 — pull to refresh reloads the activity list
- swipe:
    from:
      id: "discover-list"
    direction: DOWN
- assertVisible: "Creek Habitat Study"

# 3.5 — tapping an activity card opens the Brief phase
- tapOn: "Creek Habitat Study"
- assertVisible:
    id: "activity-screen"
- assertVisible: "Creek Habitat Study"
- assertVisible: "I'm ready — let's go"
- tapOn: "‹ Back"
- assertVisible:
    id: "discover-screen"
