// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// react-native-gesture-handler bundles libfbjni.so, which duplicates the copy
// already provided by react-android. Apply pickFirst globally so the conflict
// is resolved in every subproject's test APK, not just :app.
subprojects {
  afterEvaluate { project ->
    if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
      android {
        packagingOptions {
          jniLibs {
            pickFirsts += ['**/libfbjni.so']
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
