# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOTE: the `ports: !override` entries below REPLACE the base file's port
# mappings instead of merging with them (the base file publishes 5432/8000/3000
# on ALL interfaces — fine on a dev laptop, a hole on an internet-adjacent box).
# `!override` requires Docker Compose >= 2.24.4. Verify the merged result with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config | grep -A3 ports

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production   # static build served by nginx — NOT the Vite dev server
      args:
        NODE_ENV: production
    restart: always
    environment:
      NODE_ENV: production
      VITE_ENV: production
      VITE_DEBUG: 'false'
    # No source volumes in production — use built image
    # `!override` REPLACES the base list; a plain [] MERGES with the base
    # list instead (Compose's default for list-valued keys), which would
    # silently keep the dev bind-mount (`./frontend:/app`) active here too —
    # the same footgun already fixed for the backend service below.
    volumes: !override []
    # Loopback only — cloudflared is the sole consumer
    ports: !override
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    cpus: '1.0'

  backend:
    # Production: gunicorn with 4 UvicornWorkers (no --reload)
    #
    # `alembic upgrade head &&` runs once, before gunicorn forks its workers,
    # so there's no multi-worker race on it (unlike the advisory-lock dance
    # main.py needs for its startup.py inline-SQL patches, which run inside
    # each worker). Most schema changes in this app ship as those idempotent
    # startup.py patches instead of Alembic migrations (this project's deploy
    # path historically never ran `alembic upgrade` at all — see
    # startup.py's "TODO: convert to Alembic migrations" note) — but a few
    # migrations (20260807_case_standards, 20260816_rag_documents,
    # 20260816b_content_alignments, 20260816c_rag_documents_node_link) only
    # exist as Alembic revisions with no startup.py fallback, so they need
    # this to actually land on a real deploy. `alembic upgrade head` is a
    # no-op once applied (tracked in alembic_version), so this is safe to
    # leave in permanently rather than pull back out after this one deploy.
    # mkdir before anything else: PROMETHEUS_MULTIPROC_DIR being set makes
    # prometheus_client.Counter() require that directory to exist THE
    # MOMENT it's instantiated, in ANY process that inherits the env var —
    # not just inside a gunicorn worker. `alembic upgrade head` runs first
    # in this chain and imports core/encryption.py transitively (via
    # models.database -> models.user), which instantiates exactly such a
    # Counter at module level — and gunicorn.conf.py's on_starting hook
    # (which creates this directory) hasn't run yet at that point, because
    # gunicorn itself hasn't started. Confirmed by an actual crash-loop on
    # a real prod deploy: alembic died with `FileNotFoundError:
    # /tmp/prometheus_multiproc_dir/counter_7.db`, taking the whole
    # container down before gunicorn ever got a chance to run its own fix.
    # --workers 8 / cpus 4.0 below (was 4 / 2.0): a 2026-09 audit found the
    # host this actually runs on has 12 cores / 30GB RAM with ~26GB free at
    # typical load (checked via `free -h`/`docker stats`) — the prior limits
    # were sized for a machine roughly a tenth that size. Keeping this
    # container's existing workers:cpus ratio (2:1) rather than introducing
    # a different heuristic; raising the ceiling doesn't force more usage,
    # it just removes an artificial cap well below what the hardware can
    # provide. Validate further with the repo's own LOAD_TEST_PLAN.md/k6
    # setup rather than guessing further from here.
    command: >
      sh -c "mkdir -p /tmp/prometheus_multiproc_dir && alembic upgrade head && gunicorn main:app
      -c gunicorn.conf.py
      --workers 8
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --log-level info
      --access-logfile -"
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: INFO
      # Required for core/encryption.py's decrypt-fallback Counter (and any
      # future prometheus_client metric) to aggregate correctly across all 8
      # gunicorn workers instead of each worker reporting its own fraction.
      # /tmp is fine — gunicorn.conf.py's on_starting hook wipes and
      # recreates this on every container start, it holds no state that
      # needs to survive a restart.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc_dir
    # `!override` REPLACES the base list (a plain [] would merge = keep the
    # dev source mount). Prod runs the code baked into the image; only data
    # volumes + the Google service-account secret are mounted.
    #
    # `./logs:/app/logs` is a host bind mount (not a named volume) so
    # long-running one-off scripts (e.g. backfill_standards_embeddings.py,
    # run via `docker compose exec -d backend ... > /app/logs/foo.log`) stay
    # readable straight off the host filesystem — `docker logs` only covers
    # the main container process and is wiped on every `up -d` recreation
    # (container recreation also kills anything still attached from a prior
    # `docker exec -d`), so it's useless for tracking a detached backfill
    # across a redeploy. A file under this bind mount survives both.
    volumes: !override
      - media_files:/app/media
      - uploads_dev:/app/uploads
      - ./secrets:/run/secrets:ro
      - ./logs:/app/logs
    # Loopback only — cloudflared is the sole consumer
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: always
    # Was 1g — OOM-killed (SIGKILL, no traceback) running
    # scripts/backfill_standards_embeddings.py --all: `exec`'d processes
    # share the main container's cgroup with the 4 gunicorn workers, and
    # loading all ~561k StandardsItem ORM rows into memory at once (no
    # server-side pagination) pushed total usage over the limit. Bumped to
    # 3g first — measured (cgroup memory.stat) ~3.0GB of genuine anon
    # memory from that one-time load alone, right up against the 3g cap
    # with ~200MB headroom left for the 4 gunicorn workers plus whatever
    # the batch loop itself needs as it runs — too tight to trust. Host has
    # 26GB+ free at typical load (checked via `docker stats`/`free -h`) —
    # 6g gives real margin without meaningfully touching what's available.
    # The more correct fix is paginating that query instead of `.all()`ing
    # the whole table — not done here, this is the pragmatic unblock.
    mem_limit: 6g
    # Was 2.0 — see the --workers comment above the command: block for why.
    cpus: '4.0'

  postgres:
    restart: always
    # No host port at all — only other containers talk to Postgres
    ports: !override []
    # Server tuning via command args (NOT POSTGRES_INITDB_ARGS — initdb chokes
    # on GUC flags during first-time cluster init and the container never
    # becomes healthy on a fresh volume)
    #
    # shared_buffers/effective_cache_size/maintenance_work_mem raised in a
    # 2026-09 audit — see the backend service's --workers comment above for
    # the same "host has 12 cores/30GB, prior limits were sized for a much
    # smaller machine" context. effective_cache_size is a query-planner hint
    # (how much OS page cache Postgres should assume is available for its
    # data), not an actual allocation, so it's safe to set generously; the
    # other two DO allocate real memory, which is why mem_limit below is
    # raised to match rather than left at the old 1g (shared_buffers alone
    # would have exceeded that cap).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=100
    # Was 1g — sized only for the old shared_buffers=256MB. shared_buffers
    # (2GB) + maintenance_work_mem (256MB) + up to max_connections=100 *
    # work_mem (4MB default = ~400MB worst case) + normal backend/OS
    # overhead comfortably fits in 4g with real headroom, without reserving
    # a large fraction of the host's 30GB for a database this size.
    mem_limit: 4g
    # shared_buffers itself doesn't need this (Postgres's main buffer pool
    # is mmap-backed, not /dev/shm-backed, on modern Linux) — but parallel
    # query workers' dynamic shared memory segments ARE /dev/shm-backed, and
    # Docker's default is only 64MB. Never explicitly set before; harmless
    # at any table size, but would surface as a confusing "could not resize
    # shared memory segment" error the first time a parallel query plan
    # actually got used against a table big enough to trigger one.
    shm_size: 1g

  redis:
    restart: always
    ports: !override []
    mem_limit: 256m

  # ── Prometheus metrics ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: peripateticware-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"   # localhost only — expose via Caddy if needed
    networks:
      - peripateticware
    restart: unless-stopped

volumes:
  prometheus_data:
