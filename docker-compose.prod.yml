# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# NOTE: the `ports: !override` entries below REPLACE the base file's port
# mappings instead of merging with them (the base file publishes 5432/8000/3000
# on ALL interfaces — fine on a dev laptop, a hole on an internet-adjacent box).
# `!override` requires Docker Compose >= 2.24.4. Verify the merged result with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config | grep -A3 ports

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production   # static build served by nginx — NOT the Vite dev server
      args:
        NODE_ENV: production
    restart: always
    environment:
      NODE_ENV: production
      VITE_ENV: production
      VITE_DEBUG: 'false'
    # No source volumes in production — use built image
    # `!override` REPLACES the base list; a plain [] MERGES with the base
    # list instead (Compose's default for list-valued keys), which would
    # silently keep the dev bind-mount (`./frontend:/app`) active here too —
    # the same footgun already fixed for the backend service below.
    volumes: !override []
    # Loopback only — cloudflared is the sole consumer
    ports: !override
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    cpus: '1.0'

  backend:
    # Production: gunicorn with 4 UvicornWorkers (no --reload)
    #
    # `alembic upgrade head &&` runs once, before gunicorn forks its workers,
    # so there's no multi-worker race on it (unlike the advisory-lock dance
    # main.py needs for its startup.py inline-SQL patches, which run inside
    # each worker). Most schema changes in this app ship as those idempotent
    # startup.py patches instead of Alembic migrations (this project's deploy
    # path historically never ran `alembic upgrade` at all — see
    # startup.py's "TODO: convert to Alembic migrations" note) — but a few
    # migrations (20260807_case_standards, 20260816_rag_documents,
    # 20260816b_content_alignments, 20260816c_rag_documents_node_link) only
    # exist as Alembic revisions with no startup.py fallback, so they need
    # this to actually land on a real deploy. `alembic upgrade head` is a
    # no-op once applied (tracked in alembic_version), so this is safe to
    # leave in permanently rather than pull back out after this one deploy.
    command: >
      sh -c "alembic upgrade head && gunicorn main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --graceful-timeout 30
      --log-level info
      --access-logfile -"
    environment:
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: INFO
    # `!override` REPLACES the base list (a plain [] would merge = keep the
    # dev source mount). Prod runs the code baked into the image; only data
    # volumes + the Google service-account secret are mounted.
    volumes: !override
      - media_files:/app/media
      - uploads_dev:/app/uploads
      - ./secrets:/run/secrets:ro
    # Loopback only — cloudflared is the sole consumer
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: always
    # Was 1g — OOM-killed (SIGKILL, no traceback) running
    # scripts/backfill_standards_embeddings.py --all: `exec`'d processes
    # share the main container's cgroup with the 4 gunicorn workers, and
    # loading all ~561k StandardsItem ORM rows into memory at once (no
    # server-side pagination) pushed total usage over the limit. Bumped to
    # 3g first — measured (cgroup memory.stat) ~3.0GB of genuine anon
    # memory from that one-time load alone, right up against the 3g cap
    # with ~200MB headroom left for the 4 gunicorn workers plus whatever
    # the batch loop itself needs as it runs — too tight to trust. Host has
    # 26GB+ free at typical load (checked via `docker stats`/`free -h`) —
    # 6g gives real margin without meaningfully touching what's available.
    # The more correct fix is paginating that query instead of `.all()`ing
    # the whole table — not done here, this is the pragmatic unblock.
    mem_limit: 6g
    cpus: '2.0'

  postgres:
    restart: always
    # No host port at all — only other containers talk to Postgres
    ports: !override []
    # Server tuning via command args (NOT POSTGRES_INITDB_ARGS — initdb chokes
    # on GUC flags during first-time cluster init and the container never
    # becomes healthy on a fresh volume)
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - max_connections=100
    mem_limit: 1g

  redis:
    restart: always
    ports: !override []
    mem_limit: 256m

  # ── Prometheus metrics ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: peripateticware-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"   # localhost only — expose via Caddy if needed
    networks:
      - peripateticware
    restart: unless-stopped

volumes:
  prometheus_data:
