# Prometheus Configuration for Peripateticware
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'peripateticware-monitor'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Target fixed 2026-09: 'fastapi:8000' never resolved (no such docker
  # network alias — the actual service/container is 'backend'), and nothing
  # mounted a /metrics endpoint anyway until main.py's prometheus_client
  # wiring. This job is now real; the others below are not (see note).
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s

  # NOTE (2026-09): postgres/redis/nginx/grafana below are aspirational —
  # none of postgres-exporter, a redis metrics sidecar (Redis itself speaks
  # RESP, not HTTP, so ':6379/metrics' can never work without one), an nginx
  # exporter, or a grafana service exist in any docker-compose*.yml. Left
  # as-is rather than removed, since they document the intended full stack,
  # but standing them up is a separate task from the fastapi target fixed
  # above — do not assume these are live.
  - job_name: 'postgres'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  - job_name: 'redis'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  - job_name: 'nginx'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 15s

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s