<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Peripateticware — crow silhouette favicon -->
  <rect width="64" height="64" rx="12" fill="#1a3a2a"/>
  <!-- Body -->
  <ellipse cx="32" cy="38" rx="14" ry="10" fill="#e8f5e9"/>
  <!-- Head -->
  <circle cx="44" cy="26" r="8" fill="#e8f5e9"/>
  <!-- Beak -->
  <polygon points="52,24 59,26 52,28" fill="#f59e0b"/>
  <!-- Eye -->
  <circle cx="46" cy="25" r="2" fill="#1a3a2a"/>
  <circle cx="46.5" cy="24.5" r="0.7" fill="white"/>
  <!-- Wing -->
  <path d="M20,36 Q18,28 28,30 Q22,38 20,36Z" fill="#c8e6c9"/>
  <!-- Tail -->
  <path d="M18,40 L10,44 L16,38 L12,50 L20,44Z" fill="#e8f5e9"/>
  <!-- Legs -->
  <line x1="30" y1="48" x2="28" y2="56" stroke="#1a3a2a" stroke-width="2"/>
  <line x1="34" y1="48" x2="36" y2="56" stroke="#1a3a2a" stroke-width="2"/>
</svg>
