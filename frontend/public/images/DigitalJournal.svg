<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="420" height="220" fill="#dceedd"/>
  <!-- Distant hills -->
  <ellipse cx="100" cy="210" rx="140" ry="60" fill="#b8d4be" opacity="0.6"/>
  <ellipse cx="340" cy="215" rx="120" ry="50" fill="#c4dbc9" opacity="0.5"/>
  <!-- Ground -->
  <rect y="200" width="420" height="120" fill="#8aaa78"/>
  <!-- Grass tufts -->
  <g fill="#6a8a58">
    <rect x="20" y="196" width="3" height="10" rx="1"/>
    <rect x="28" y="193" width="3" height="13" rx="1"/>
    <rect x="36" y="197" width="3" height="9" rx="1"/>
    <rect x="60" y="195" width="3" height="11" rx="1"/>
    <rect x="200" y="196" width="3" height="10" rx="1"/>
    <rect x="380" y="194" width="3" height="12" rx="1"/>
    <rect x="390" y="197" width="3" height="9" rx="1"/>
  </g>

  <!-- Student sitting on a rock -->
  <!-- Rock -->
  <ellipse cx="220" cy="230" rx="45" ry="18" fill="#9aaa90"/>
  <ellipse cx="220" cy="224" rx="43" ry="16" fill="#aabaa0"/>
  <!-- Body -->
  <rect x="198" y="188" width="28" height="38" rx="8" fill="#5a7a8a"/>
  <!-- Head -->
  <circle cx="212" cy="180" r="14" fill="#f5c5a3"/>
  <!-- Hair -->
  <path d="M198 175 Q212 160 226 175" fill="#4a3020"/>
  <!-- Hat brim -->
  <rect x="196" y="172" width="32" height="5" rx="2" fill="#6a4820"/>
  <rect x="200" y="160" width="24" height="14" rx="4" fill="#7a5828"/>
  <!-- Arm extended holding journal -->
  <rect x="184" y="200" width="16" height="8" rx="4" fill="#5a7a8a" transform="rotate(-20 192 204)"/>

  <!-- Journal / notebook — reduced ~20% -->
  <rect x="144" y="200" width="42" height="32" rx="4" fill="#f5f0e8" stroke="#d4c8b0" stroke-width="1.5"/>
  <rect x="144" y="200" width="7" height="32" rx="3" fill="#c8563c"/>
  <!-- Journal lines -->
  <line x1="156" y1="209" x2="182" y2="209" stroke="#c8b898" stroke-width="1.2"/>
  <line x1="156" y1="216" x2="182" y2="216" stroke="#c8b898" stroke-width="1.2"/>
  <line x1="156" y1="223" x2="182" y2="223" stroke="#c8b898" stroke-width="1.2"/>
  <line x1="156" y1="229" x2="174" y2="229" stroke="#c8b898" stroke-width="1.2"/>
  <!-- Small sketch in journal -->
  <ellipse cx="174" cy="212" rx="4" ry="3" fill="none" stroke="#8aaa78" stroke-width="1"/>
  <!-- Pencil -->
  <rect x="186" y="205" width="3" height="16" rx="1" fill="#f5c832" transform="rotate(-15 187 213)"/>
  <polygon points="186,219 189,219 187,223" fill="#f5c5a3" transform="rotate(-15 187 213)"/>

  <!-- Phone / device — reduced ~22% -->
  <rect x="236" y="197" width="22" height="36" rx="4" fill="#2a3a4a" stroke="#1a2a3a" stroke-width="1"/>
  <rect x="238" y="200" width="18" height="29" rx="2" fill="#3dd68c" opacity="0.3"/>
  <!-- GPS pin on screen -->
  <circle cx="247" cy="213" r="4" fill="#c8563c"/>
  <circle cx="247" cy="212" r="2" fill="white"/>
  <polygon points="247,217 244,212 250,212" fill="#c8563c"/>
  <!-- Small map lines -->
  <line x1="240" y1="220" x2="254" y2="220" stroke="#6aaa88" stroke-width="1" opacity="0.6"/>
  <line x1="240" y1="224" x2="251" y2="224" stroke="#6aaa88" stroke-width="1" opacity="0.6"/>

  <!-- Crow (Peri) in flight — learning in motion -->
  <!-- Left wing sweeping down and back -->
  <path d="M305 95 Q292 112 285 125 Q298 118 312 108" fill="#1a1a2a"/>
  <!-- Right wing sweeping up and forward -->
  <path d="M320 88 Q336 76 350 78 Q340 90 328 96" fill="#1a1a2a"/>
  <!-- Body -->
  <ellipse cx="316" cy="98" rx="11" ry="7" fill="#1a1a2a"/>
  <!-- Tail fanned out behind -->
  <path d="M305 101 Q296 108 292 106 Q299 100 305 99" fill="#1a1a2a"/>
  <path d="M305 103 Q294 113 290 112 Q298 105 305 102" fill="#252535"/>
  <!-- Head -->
  <circle cx="327" cy="93" r="7" fill="#1a1a2a"/>
  <!-- Beak (pointing right and slightly down — in flight) -->
  <polygon points="334,92 342,94 334,96" fill="#d4a020"/>
  <!-- Eye -->
  <circle cx="330" cy="91" r="1.8" fill="white"/>
  <circle cx="330.4" cy="91" r="0.9" fill="#1a1a2a"/>
  <!-- Trailing legs tucked in flight -->
  <line x1="314" y1="104" x2="310" y2="110" stroke="#d4a020" stroke-width="1.2"/>
  <line x1="318" y1="104" x2="316" y2="110" stroke="#d4a020" stroke-width="1.2"/>

  <!-- Sun -->
  <circle cx="370" cy="50" r="28" fill="#f5d840" opacity="0.85"/>
  <g stroke="#f5d840" stroke-width="2" opacity="0.6">
    <line x1="370" y1="10" x2="370" y2="18"/>
    <line x1="370" y1="82" x2="370" y2="90"/>
    <line x1="330" y1="50" x2="338" y2="50"/>
    <line x1="402" y1="50" x2="410" y2="50"/>
    <line x1="342" y1="22" x2="348" y2="28"/>
    <line x1="392" y1="72" x2="398" y2="78"/>
    <line x1="398" y1="22" x2="392" y2="28"/>
    <line x1="348" y1="72" x2="342" y2="78"/>
  </g>

  <!-- Small plants -->
  <g fill="#4a8a5a">
    <ellipse cx="80" cy="205" rx="12" ry="8"/>
    <ellipse cx="72" cy="208" rx="9" ry="6"/>
    <ellipse cx="88" cy="207" rx="10" ry="7"/>
    <rect x="79" y="207" width="3" height="15" rx="1"/>
  </g>
  <g fill="#5aaa5a">
    <ellipse cx="370" cy="205" rx="10" ry="7"/>
    <ellipse cx="363" cy="208" rx="8" ry="5"/>
    <rect x="369" y="207" width="3" height="12" rx="1"/>
  </g>

  <!-- Floating text label: "Field Journal" -->
  <rect x="130" y="248" width="120" height="24" rx="12" fill="#2d5037" opacity="0.88"/>
  <text x="190" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="white" font-weight="600">Field Journal</text>
</svg>
