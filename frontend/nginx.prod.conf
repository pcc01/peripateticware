# Peripateticware — production SPA server (frontend container, port 3000).
# Published on 127.0.0.1:3000 by docker-compose.prod.yml; consumed by
# cloudflared (and by SSH port-forwards during setup/testing).
#
# API calls are proxied to the backend container so this server is
# self-contained: the app works via a bare port-forward to :3000 even before
# the Cloudflare tunnel exists. In production the tunnel path-routes /api/*
# directly to the backend, so this proxy is the fallback path, not the hot path.

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;

    # Security headers (Cloudflare adds HSTS at the edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API → backend container (Docker network DNS: service name "backend")
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (real-time session features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;          # AI inference can be slow
        client_max_body_size 50M;         # evidence photo/audio uploads
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Locale files — revalidate (updated without a rebuild of hashes)
    location /locales/ {
        expires 1h;
        try_files $uri =404;
    }

    # SPA fallback — client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
