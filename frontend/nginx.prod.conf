# Peripateticware — production SPA server (frontend container, port 3000).
# Only cloudflared talks to this (published on 127.0.0.1:3000 by
# docker-compose.prod.yml). API traffic never touches this server — the
# Cloudflare tunnel routes /api/* and /health straight to the backend.

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1000;

    # Security headers (Cloudflare adds HSTS at the edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Locale files — revalidate (updated without a rebuild of hashes)
    location /locales/ {
        expires 1h;
        try_files $uri =404;
    }

    # SPA fallback — client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
