name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Also run nightly for link audit
  schedule:
    - cron: '0 6 * * *'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docker-compose.yml's backend service has `env_file: - .env` — Compose
      # hard-fails immediately (in ~5s, before any pull/build) if that file
      # doesn't exist, and .env is gitignored so a fresh checkout has none.
      # Every variable docker-compose.yml actually needs already has a
      # `${VAR:-default}` fallback baked into its `environment:` block, so an
      # empty file is enough to satisfy env_file and let those defaults apply
      # — this is not a secrets file, just presence to unblock Compose.
      - name: Create .env for docker compose
        run: touch .env

      # Previously this job used a `services:` block pointing at
      # ghcr.io/${{ github.repository }}/backend:latest. No workflow in this
      # repo ever builds or publishes that image — deploy.yml builds it
      # locally as `peripateticware-backend:latest` and its "push to
      # registry" step is a stub that only echoes a message — so every run
      # failed within ~15s at "Docker pull failed with exit code 1" before a
      # single test ever executed. Building the stack from the checked-out
      # source instead removes the registry dependency entirely and matches
      # how the repo already documents running locally (docker-compose.yml).
      - name: Build and start the stack
        run: docker compose up -d --build postgres redis backend frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend... ($i/60)"
            sleep 2
          done
          echo "Frontend did not come up in time"
          docker compose logs frontend
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Create auth state directory
        working-directory: frontend
        run: mkdir -p tests/e2e/.auth

      - name: Run E2E tests
        working-directory: frontend
        env:
          # docker-compose's frontend service serves on :3000 (see
          # docker-compose.yml + frontend/Dockerfile) — the previous value of
          # :5173 never matched anything actually running in this setup, so
          # even a successful backend pull would have failed here next.
          BASE_URL: http://localhost:3000
          # auth.setup.ts falls back to the seeded dev accounts
          # (teacher@example.com / SecurePass123! etc, created by
          # seed_demo_users() when ENVIRONMENT=development — the default in
          # docker-compose.yml) when these secrets aren't configured, so the
          # suite runs zero-config; set these secrets to point at different
          # accounts/environment if needed.
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_PARENT_EMAIL: ${{ secrets.TEST_PARENT_EMAIL }}
          TEST_PARENT_PASSWORD: ${{ secrets.TEST_PARENT_PASSWORD }}
        run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        # Optional: replace with a Slack or GitHub PR comment action
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "E2E results for PR #${{ github.event.pull_request.number }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Peripateticware CI
          body: "See attached report for PR ${{ github.event.pull_request.html_url }}"
