name: Locale Validation

# Runs frontend/scripts/validate_locales.cjs — a static, offline check of
# every public/locales/**/*.json file against the en/ baseline. It catches
# the corruption bug classes a 2026-08 audit found on the landing page (type
# mismatches that crash React with "Objects are not valid as a React child",
# leaked LLM/translator meta-commentary, stringified-list pipeline
# artifacts, mojibake) before they reach main, rather than relying on a human
# noticing a locale-specific bug in production. See the script's own header
# comment for the full rationale and severity model (ERROR fails the job;
# WARN — missing keys, likely-untranslated strings — is informational only).
#
# Deliberately does NOT run i18n:qa (scripts/localization_qa_crawler.py):
# that tool needs a live app + Ollama + seeded demo accounts and does
# translation-quality/fluency review, not structural validation — a
# different job for a different (manual/scheduled) trigger.
on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/public/locales/**'
      - 'frontend/scripts/validate_locales.cjs'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/public/locales/**'
      - 'frontend/scripts/validate_locales.cjs'

jobs:
  validate-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: cd frontend && npm run i18n:validate
