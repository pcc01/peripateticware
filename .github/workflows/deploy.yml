name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # i18next-parser (npx-installed fresh each run, unpinned) currently
          # pulls in undici@7.x, which requires Node >=20.18.1 — 18 crashes
          # the i18n:extract step with "ReferenceError: File is not defined"
          # before the translation sync step is ever reached.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Python localization dependencies
        run: pip install requests

      - name: Run localization pipeline (tag → extract → XLIFF/W3C PROV sync)
        # i18n:run-all:ci uses --provider MICROSOFT (translate_sync.py's
        # MS_TRANSLATOR_KEY/REGION path). Plain i18n:run-all defaults to
        # OLLAMA, which shells out to a local `ollama` binary — not installed
        # on a GitHub-hosted runner, and even if it were, there'd be no route
        # to a model to run. Local `npm run i18n:run-all` is untouched for
        # dev machines that do have Ollama running.
        run: cd frontend && npm run i18n:run-all:ci
        env:
          OLLAMA_MODEL_TEXT: ${{ secrets.OLLAMA_MODEL_TEXT || 'mistral' }}
          MS_TRANSLATOR_KEY: ${{ secrets.MS_TRANSLATOR_KEY }}
          MS_TRANSLATOR_REGION: ${{ secrets.MS_TRANSLATOR_REGION || 'global' }}

      - name: Commit updated translations and XLIFF provenance files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/locales/
          git diff --staged --quiet || git commit -m "chore(i18n): update translations and XLIFF provenance [skip ci]"
          git push

      - name: Build Docker images
        run: |
          docker build -t peripateticware-frontend:latest ./frontend
          docker build -t peripateticware-backend:latest ./backend

      - name: Push to registry (configure for your registry)
        run: |
          # Example: docker push to Docker Hub, ECR, etc.
          # docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          # docker push peripateticware-frontend:latest
          # docker push peripateticware-backend:latest
          echo "Configure Docker registry credentials in GitHub secrets"

      - name: Deploy (configure for your infrastructure)
        run: |
          # Example deployment commands
          # docker-compose -f docker-compose.prod.yml up -d
          echo "Configure deployment commands for your infrastructure"
