name: Mobile E2E (Maestro)

# New alongside mobile-e2e.yml (Detox), not a replacement for it (yet).
#
# Why this exists: mobile-e2e.yml's Detox suite has never passed a single
# CI run (48/48 failed or timed out). Root cause, confirmed via a real
# Android logcat capture (no crash, no ANR, near-zero frame drops — the app
# itself is healthy) plus a matching upstream report (wix/Detox#4506):
# Detox's synchronization layer deadlocks against React Native's New
# Architecture (Fabric/Bridgeless, on by default here — see app.json /
# android/gradle.properties), and this project can't turn New Architecture
# off to work around it since react-native-reanimated hard-requires it.
#
# The mobile/maestro/ suite (23 flows, converted from the Detox suite on
# 2026-07-15) was already built and run locally with real results — 13-17
# of 18 tests passing per device in 8-9.5 minutes total, vastly better than
# Detox's 0-for-48 — but was never wired into CI. This workflow is that
# wiring. Maestro drives the OS accessibility tree directly instead of
# injecting a sync bridge into the app's JS runtime, which is why it isn't
# hitting the same deadlock.
on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e-maestro.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # ANDROID — same API-level matrix as mobile-e2e.yml's Detox job, minus the
  # Detox-only scaffolding (no assembleAndroidTest / DetoxJUnitRunner APK —
  # Maestro drives the already-installed release APK directly).
  # ──────────────────────────────────────────────────────────────────────────
  android-maestro:
    name: Android Maestro ${{ matrix.android-version }} (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # 75, not 60: the cold-Gradle-cache story from the original 60-minute
    # comment still applies ("Build APK for testing" hit 22m19s on a
    # completely cold cache before the emulator even booted). On top of
    # that, "Run Android AVD + Maestro tests" now runs every flow as its
    # own `maestro test` invocation via scripts/run-maestro-flows.sh instead
    # of one shared session per shard (see that step's own comment on the
    # DeviceServerDiedException/device-offline failures this works around)
    # — Android's per-flow driver restart is much cheaper than iOS's
    # xcodebuild-based one, but ~22 flows' worth of it is still real added
    # time, not just headroom.
    timeout-minutes: 75

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        # -U test_user -d test_db: see mobile-e2e.yml's matching comment —
        # bare pg_isready (or -U alone with no -d) spams backend.log with a
        # FATAL role/database error every 10s for the container's whole
        # lifetime without actually affecting the health check's result.
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            android-version: '15 VanillaIceCream'
            target: google_apis
            arch: x86_64
            profile: pixel_6
            avd-name: Pixel_6_API_35

          - api-level: 33
            android-version: '13 Tiramisu'
            target: google_apis
            arch: x86_64
            profile: pixel_6
            avd-name: Pixel_6_API_33

          - api-level: 30
            android-version: '11 R'
            target: google_apis
            arch: x86_64
            profile: pixel_4
            avd-name: Pixel_6_API_30

          - api-level: 24
            android-version: '7.0 Nougat'
            target: default       # google_apis x86_64 not available for API 24
            arch: x86
            profile: Nexus 5X
            avd-name: Nexus_5X_API_24

    steps:
      - uses: actions/checkout@v4

      # See the matching comment in mobile-e2e.yml — ubuntu-latest starts
      # with well under half its disk free before touching AVD creation or
      # a real Gradle build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Setup Python 3.12 (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # BUG (found via a real Maestro run): the Postgres service container
      # below never gets database/init.sql run against it. That file (and
      # its docker-entrypoint-initdb.d mount in docker-compose.yml) is the
      # ONLY thing that CREATEs users/activities/etc. — startup.py's inline
      # "migrations" only ever ALTER TABLE those, assuming they already
      # exist. A service container can't just mount init.sql the way
      # docker-compose.yml does either: GitHub Actions creates service
      # containers during "Initialize containers", which runs BEFORE
      # actions/checkout — the file wouldn't exist in $GITHUB_WORKSPACE yet
      # at that point. Loading it explicitly here, after checkout, once
      # Postgres is already up (the job scheduler already waited for its
      # health check to pass before running any step), sidesteps that
      # ordering problem. Confirmed as the actual cause of every real
      # Maestro test failure so far: Postgres logs showed `relation "users"
      # does not exist` continuously through the whole run, and the app's
      # own login screen surfaced it as "Login failed due to server error"
      # for a perfectly valid seeded test account.
      - name: Load database schema (database/init.sql)
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -f database/init.sql

      # Backgrounded — see the matching comment in mobile-e2e.yml.
      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "Backend starting (PID $!)"
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: development
          # Every capture-upload flow (12.x) 500'd on a real CI run:
          # routes/student.py's local-disk fallback (used whenever
          # CF_R2_ACCOUNT_ID isn't set, true here) defaulted to /app/uploads
          # unconditionally — a real path only inside the Docker image
          # (docker-compose.yml mounts a volume there); the backend here
          # runs directly via uvicorn with no container, and /app doesn't
          # exist and can't be created without root. UPLOAD_DIR is now a
          # real Settings field (core/config.py); this points it somewhere
          # actually writable, relative to this step's own working-directory.
          UPLOAD_DIR: ./uploads

      - name: Enable KVM (Android emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-maestro-${{ hashFiles('mobile/android/**/*.gradle*') }}-${{ matrix.api-level }}

      # Same release build Detox used (expo export:embed bundles the JS at
      # Gradle's normal release lifecycle point, so the app never depends on
      # a running Metro server) — just assembleRelease, no
      # assembleAndroidTest, since Maestro doesn't need the Detox
      # instrumentation/test APK at all.
      # 127.0.0.1, not localhost — see the iOS job's matching comment: a
      # real iOS run's device log showed NSURLSession racing "localhost"'s
      # IPv6 (::1) and IPv4 resolutions, getting an instant Connection
      # refused on ::1 (uvicorn only binds 0.0.0.0/IPv4) before falling
      # back. No confirmed evidence of the same on Android, but pinning the
      # IP here too costs nothing and rules it out.
      - name: Build APK for testing
        working-directory: mobile/android
        run: sh ./gradlew --no-daemon assembleRelease
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend/backend.log
          exit 1

      - name: Run Android AVD + Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd-name }}
          working-directory: mobile
          # `adb reverse tcp:8000 tcp:8000`: see the matching comment in
          # mobile-e2e.yml — this emulator's virtio-wifi/netsim networking
          # doesn't reliably honor the classic 10.0.2.2 host-loopback alias.
          # No LOCATION_PERMISSION env var — the affected flows now grant it
          # via a platform-gated launchApp block (see
          # maestro/flows/capture/12.1-note-capture.yaml's header for why
          # `-e`-substitution wasn't reliable enough for this one).
          #
          # One `maestro test` invocation per flow FILE (via
          # scripts/run-maestro-flows.sh), not one invocation per folder or
          # shard. This used to be two hand-split shards (activity/auth/
          # capture/discover/journal, then navigation/onboarding/perispeech/
          # progress/settings/starter, with geofence pulled into its own
          # third invocation — see below) as a real fix for a real problem:
          # a CI run's raw log showed the whole step going silent mid-flow
          # (no Maestro output at all for the rest of the run) with
          # `maestro.android.DeviceServerDiedException: Device server died
          # during 'disableLocationUpdates' (connection age 629325ms)`; a
          # separate run hit the same dead-silence pattern with
          # `IOException: Command failed (host:transport:emulator-5554):
          # device 'emulator-5554' not found` instead. Different exact
          # symptom, same shape — the emulator/Maestro session becomes
          # unstable after sustained load and everything after that point
          # fails instantly with no real error, not because of anything
          # wrong in those specific flows.
          #
          # Splitting into two shards only halved the odds of hitting
          # whatever threshold this is — a later real run on API 35 still
          # hit it mid-shard (`device offline` / DeviceServerDiedException
          # right after 9.2-theme-change, ~187s into that shard's session,
          # taking every remaining flow in it down with it: 9.1, 9.4, 9.5,
          # 0.1-sanity all failed instantly against the same dead
          # connection). One invocation per flow file removes the
          # "sustained session" this depends on entirely — each flow gets
          # its own fresh connection, so a dead one only costs that flow.
          # This also makes the old geofence-isolation unnecessary as a
          # special case (see below): geofence already gets its own
          # invocation like everything else now, so it's back in the main
          # folder list instead of split out.
          #
          # This action's `script:` field runs each line of the block as
          # its own separate shell invocation — confirmed the hard way in
          # the old two-shard version: a `\`-continued long `maestro test
          # ...` line doesn't work as a line continuation here (each line
          # is independent), so Maestro received a literal stray `\` as a
          # flow-path argument and failed instantly on "Flow path does not
          # exist". That's exactly why the per-flow loop below lives in its
          # own script file invoked as a single line, rather than as an
          # inline shell `for` loop spanning several lines of this block.
          # `; echo $? > /tmp/*_exit` on each invocation exists for the same
          # reason as before — a line's own reported exit status is
          # whatever its LAST subcommand returns, so this makes the line
          # always look like it succeeded (echo/redirect essentially never
          # fails) and later lines still run regardless of this one's real
          # result, while still recording that real result in a file for
          # the final line to check.
          # `maestro/flows/offline/` is deliberately excluded from the main
          # sweep and run separately below: 13.1/13.2's own header
          # comments already document that they need real OS network
          # toggling around them (`adb shell svc wifi/data disable` before
          # 13.1, re-enable before 13.2 — Maestro YAML has no way to do
          # this itself), the same thing
          # scripts/run-offline-capture-test.ps1 does for local runs.
          #
          # offline/14.0-14.2 (multi-step scavenger hunt with no signal) are
          # ALSO in this folder and ALSO excluded here. They need a harder
          # network cut than `svc wifi/data disable` gives on this AVD — the
          # backend actually has to be unreachable — so they're driven by
          # scripts/run-wayfinding-offline-test.ps1 (stops the backend
          # container around the offline leg) and verified there, not in CI.
          # This
          # was previously just folded into the general sweep with no
          # network toggle at all, so the app was always online and the
          # OFFLINE-queue branch (the entire point of 13.1) could never
          # actually trigger — "📵 Saved offline" was never going to
          # appear no matter how long anything waited. Timing/sleeps here
          # (3s after disabling, 20s after re-enabling) mirror that
          # script's — the 20s covers useConnectivity's 15s poll interval
          # so 13.2 doesn't check for the synced state before the app has
          # even noticed it's back online.
          #
          # `svc wifi disable` + `svc data disable` alone still weren't
          # enough on a real CI run — 13.1 still failed with "📵 Saved
          # offline" never appearing, i.e. CaptureSheet.tsx's
          # Network.getNetworkStateAsync() still reported online. Tried
          # adding `settings put global airplane_mode_on 1` + broadcasting
          # android.intent.action.AIRPLANE_MODE alongside it (reasoning:
          # this AVD's boot log shows `Successfully initialized netsim
          # WiFi` — the netsim-backed virtual WiFi some emulator images use
          # sits below the WifiManager layer `svc wifi` toggles). Reverted
          # after two real CI runs: the job's exit code changed from a
          # normal test-failure `1` to `255` both times, and 13.2 never
          # even ran — junit-4.xml was missing entirely, meaning the whole
          # step died partway through shard 3 rather than any flow
          # actually failing. That's a new, worse failure mode than the
          # one being fixed, and it correlates too cleanly with this one
          # change across two separate runs to be coincidence — broadcasting
          # airplane mode likely destabilizes this AVD's netsim network
          # stack (a system_server broadcast receiver + netsim reinit
          # interacting badly). 13.1 not actually going offline in CI is a
          # known, lower-severity gap (documented in the flow's own header)
          # until a safer toggle mechanism is found — not worth trading for
          # a flakier whole-job crash.
          #
          # geofence used to be pulled out into its own invocation here
          # (`shard1geo`) because a real CI run's raw log showed
          # `maestro.android.DeviceServerDiedException: Device server died
          # during 'disableLocationUpdates'` on API 30 (Pixel_4 profile)
          # specifically, 100% reproducible across every run that reached
          # it (4 for 4) — Maestro's own cleanup of 10-geofence.yaml's
          # location mock killed the device connection, taking every flow
          # still queued in that same invocation down with it. It's back in
          # the main list below: scripts/run-maestro-flows.sh already gives
          # every flow, geofence included, its own invocation, so that
          # crash (whenever it still happens) once again only costs
          # geofence's own exit code, not anything queued after it.
          script: |
            mkdir -p artifacts
            adb reverse tcp:8000 tcp:8000
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            nohup adb logcat > artifacts/logcat.txt 2>&1 &
            bash scripts/run-maestro-flows.sh artifacts main activity auth capture discover geofence wayfinding journal navigation onboarding perispeech progress settings starter; echo $? > /tmp/main_exit
            adb shell svc wifi disable; adb shell svc data disable; sleep 3
            maestro test maestro/flows/offline/13.1-offline-capture-queued.yaml -e STUDENT_EMAIL="$STUDENT_EMAIL" -e STUDENT_PASSWORD="$STUDENT_PASSWORD" --format junit --output artifacts/junit-offline-1.xml; echo $? > /tmp/offline1_exit
            adb shell svc wifi enable; adb shell svc data enable; sleep 20
            maestro test maestro/flows/offline/13.2-offline-capture-syncs.yaml -e STUDENT_EMAIL="$STUDENT_EMAIL" -e STUDENT_PASSWORD="$STUDENT_PASSWORD" --format junit --output artifacts/junit-offline-2.xml; echo $? > /tmp/offline2_exit
            cp -r "$HOME/.maestro/tests" artifacts/maestro-tests 2>/dev/null
            test "$(cat /tmp/main_exit)" = 0 -a "$(cat /tmp/offline1_exit)" = 0 -a "$(cat /tmp/offline2_exit)" = 0
        env:
          STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android-api${{ matrix.api-level }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # iOS — same version matrix as mobile-e2e.yml's Detox job.
  # ──────────────────────────────────────────────────────────────────────────
  ios-maestro:
    name: iOS Maestro ${{ matrix.ios-version }} (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    # 90, not 60: the cold-cache build story from the original 60-minute
    # comment still applies (~16 min for a cold CocoaPods "Build iOS app for
    # testing"), and on top of that the "Run Maestro tests" step now spins up
    # a fresh XCUITest driver per flow file instead of once per shard (see
    # that step's own comment on the iOS 26 DeviceUnreachableException this
    # works around) — 20 flows x up to ~90s driver startup each is real
    # added time, not just headroom.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - ios-version: '26'
            runner: macos-latest
            device: iPhone 17
            xcode-version: latest-stable

          - ios-version: '18'
            runner: macos-15
            device: iPhone 16
            xcode-version: '16'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Setup Python 3.12 (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Postgres + Redis (Homebrew)
        run: brew install postgresql@16 pgvector redis

      - name: Start Postgres + Redis, create test_db
        run: |
          brew services start postgresql@16
          brew services start redis
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          for i in $(seq 1 30); do
            "$PG_BIN/pg_isready" -h localhost -p 5432 && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          "$PG_BIN/createuser" -s test_user
          "$PG_BIN/psql" -d postgres -c "ALTER USER test_user WITH PASSWORD 'test_password';"
          "$PG_BIN/createdb" -O test_user test_db
          "$PG_BIN/psql" -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          # See the matching comment on the Android job's "Load database
          # schema" step — database/init.sql is the only thing that
          # actually CREATEs users/activities/etc.; startup.py's inline
          # migrations only ALTER them, assuming they already exist.
          "$PG_BIN/psql" -h localhost -U test_user -d test_db -f database/init.sql

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "Backend starting (PID $!)"
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: development
          # Every capture-upload flow (12.x) 500'd on a real CI run:
          # routes/student.py's local-disk fallback (used whenever
          # CF_R2_ACCOUNT_ID isn't set, true here) defaulted to /app/uploads
          # unconditionally — a real path only inside the Docker image
          # (docker-compose.yml mounts a volume there); the backend here
          # runs directly via uvicorn with no container, and /app doesn't
          # exist and can't be created without root. UPLOAD_DIR is now a
          # real Settings field (core/config.py); this points it somewhere
          # actually writable, relative to this step's own working-directory.
          UPLOAD_DIR: ./uploads

      - name: Setup Ruby + Bundler (pinned CocoaPods via mobile/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-maestro-${{ hashFiles('mobile/ios/Podfile.lock') }}-${{ matrix.ios-version }}
          restore-keys: pods-maestro-

      - name: Generate native iOS project (Expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install Pods (pinned CocoaPods via bundle exec)
        working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      # Same Release build Detox used (embeds the JS bundle so the app never
      # depends on a running Metro server — see .detoxrc.js's ios.debug
      # comment for the full history of why Debug doesn't work here).
      # 127.0.0.1, not localhost: a real CI run's device-simulator.log
      # showed the root cause behind nearly every flaky iOS Maestro
      # failure (12.x capture flows' "Creek Habitat Study" not found,
      # 9.1/9.2/9.4/9.5, etc. — different symptoms, same cause). Every
      # single network request from the app logged an instant "Connection
      # refused" on ::1:8000 (IPv6 loopback) — NSURLSession races
      # "localhost"'s IPv6 and IPv4 resolutions (Happy Eyeballs), and
      # uvicorn only binds 0.0.0.0 (IPv4), so ::1 always refuses. The
      # eventual IPv4 fallback still works, but not before adding several
      # seconds of latency per request — enough to blow past Maestro's
      # ~17s default command timeout on a screen whose content depends on
      # 2-3 sequential API calls. Using the literal IPv4 address skips the
      # IPv6 attempt (and the refusal) entirely.
      - name: Build iOS app for testing
        working-directory: mobile
        run: |
          xcodebuild -workspace ios/Peripateticware.xcworkspace \
            -scheme Peripateticware \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8000

      # Same JSON+jq UDID lookup as mobile-e2e.yml's Detox job — see its
      # matching comment for why a plain grep on `simctl list devices`
      # doesn't work (OS version and device name are never on the same
      # line in the plain-text output).
      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | \
            jq -r --arg os "iOS-${{ matrix.ios-version }}" --arg dev "${{ matrix.device }}" \
            '.devices | to_entries[] | select(.key | contains($os)) | .value[] | select(.name == $dev) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "No simulator found matching device '${{ matrix.device }}' on iOS ${{ matrix.ios-version }}. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend/backend.log
          exit 1

      - name: Run Maestro tests
        working-directory: mobile
        run: |
          mkdir -p artifacts
          xcrun simctl install "$SIMULATOR_UDID" ios/build/Build/Products/Release-iphonesimulator/Peripateticware.app
          set +e
          # No LOCATION_PERMISSION env var — a real run proved `-e`
          # substitution doesn't reach launchApp's permissions map on iOS
          # (see maestro/flows/capture/12.1-note-capture.yaml's header), so
          # the affected flows now grant it via a platform-gated launchApp
          # block instead.
          #
          # Explicit folder list, not maestro/flows/*/ — deliberately
          # excludes maestro/flows/offline/. Those two flows need real OS
          # network toggling around them (see the Android job's matching
          # comment); the Android job does that via `adb shell svc
          # wifi/data disable`. There's no `adb` on iOS, and no equivalent
          # already wired up here for the simulator (a host-level toggle
          # like disabling the runner's network interface is both
          # unverified and risky — it could also take out the backend
          # health check and every other flow's requests, since the
          # simulator shares the runner's host network stack). Previously
          # offline/ was silently included in the `*/` glob with no toggle
          # at all, so 13.1 always ran online — "📵 Saved offline" could
          # never appear, the same false failure the Android job fixed
          # separately. Skipping instead of guessing at an unverified iOS
          # network-cut mechanism.
          #
          # One `maestro test` invocation per flow FILE, not per folder or
          # one big batch — a real CI run's own artifacts (maestro.log)
          # showed `maestro.DeviceUnreachableException: Device became
          # unreachable during deviceInfo` on iOS 26/Xcode 26.6 specifically,
          # first hit mid-flow inside a `setPermissions` call, then repeating
          # identically on every remaining flow in that same batch (11/11
          # failed once it happened). Confirmed not an app crash — Maestro's
          # own crash detector logged crashFile=none for the whole session.
          # This is a known upstream Maestro/WebDriverAgent regression on iOS
          # 26.x (mobile-dev-inc/maestro#3318, #3254, #2932): the XCUITest
          # driver connection can drop mid-suite, and `maestro test <dir>`
          # keeps reusing the now-dead port for every subsequent flow instead
          # of restarting the driver. The maintainers' own documented
          # workaround is exactly this — invoke each flow file as its own
          # `maestro test` call so the driver restarts cleanly between them.
          # Costs some wall-clock (a fresh driver spin-up per flow instead of
          # once per shard — see this job's timeout-minutes, bumped
          # accordingly) in exchange for flows no longer cascading off one
          # dead connection.
          overall_exit=0
          i=0
          for dir in activity auth capture discover geofence wayfinding journal navigation onboarding perispeech progress settings starter; do
            for flow in maestro/flows/"$dir"/*.yaml; do
              # 12.3-photo-capture and 12.4-video-capture skipped on iOS only:
              # a real CI run's failure screenshot showed the in-app camera
              # preview stuck forever on "Starting camera..." for both —
              # the iOS Simulator has no camera hardware to back
              # expo-camera's CameraView, so it never fires ready and the
              # shutter/record controls this flow waits for can never
              # appear, regardless of timeout. Both already pass reliably
              # on Android, where the emulator provides a synthetic camera
              # feed. Real camera capture on iOS needs verifying on an
              # actual device, not this Simulator-only CI matrix.
              case "$flow" in
                */12.3-photo-capture.yaml|*/12.4-video-capture.yaml) continue ;;
              esac
              i=$((i + 1))
              maestro --device "$SIMULATOR_UDID" test "$flow" \
                -e STUDENT_EMAIL="$STUDENT_EMAIL" -e STUDENT_PASSWORD="$STUDENT_PASSWORD" \
                --format junit --output "artifacts/junit-$i.xml"
              [ "$?" = 0 ] || overall_exit=1
            done
          done
          cp -r "$HOME/.maestro/tests" artifacts/maestro-tests 2>/dev/null
          exit $overall_exit
        env:
          STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          # Default startup timeout has been the culprit behind several
          # "iOS driver not ready in time" job-ending failures across real
          # CI runs (xcuitest.installer.LocalXCTestInstaller$IOSDriverTimeoutException),
          # with no corresponding app or test issue — the driver just
          # hadn't finished attaching yet on a cold CI simulator boot.
          # Maestro's own error message names this exact env var as the
          # knob to turn.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "90000"

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios${{ matrix.ios-version }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14
