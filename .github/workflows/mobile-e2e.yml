name: Mobile E2E (Detox)

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'
  # Manual "Run workflow" button in the Actions tab — lets you trigger a run
  # (e.g. just the iOS 26/18 jobs) on demand without needing a push/PR, which
  # matters since those two configs can't be run locally on an Intel Mac.
  workflow_dispatch: {}

# ──────────────────────────────────────────────────────────────────────────────
# ANDROID — matrix across API 35 / 33 / 30 / 24 (API 37 — Android 17 — is
# DISABLED below; no released SDK platform for it yet)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  android-e2e:
    name: Android ${{ matrix.android-version }} (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 75

    # Real backend for the E2E login/activity flows below. mobile-e2e.yml
    # never started one — the app fell back to app.json's baked-in
    # 10.0.2.2:8000 (Android emulator's loopback to the host), which had
    # nothing listening, so every login call just hung until Detox's sync
    # watchdog gave up ("The app has not responded to the network requests
    # below..."). ubuntu-latest supports Docker/`services:` fine, so this
    # mirrors backend-tests.yml's postgres+redis service containers exactly.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false          # keep other API levels running if one fails
      matrix:
        include:
          # API 37 — Android 17 "CinnamonBun" — DISABLED. Confirmed via a real
          # run's "Install Android SDK" step: sdkmanager can't find
          # 'platforms;android-37' (or the matching system image) in any
          # channel — Android 17 has no released SDK platform yet, same class
          # of "not actually available yet" issue as the iOS 27 leg above
          # (Xcode 27 in mobile-e2e.yml's ios-e2e job). Re-add this entry once
          # Google actually ships an API 37 platform/system-image — check via
          # `sdkmanager --list` or https://developer.android.com/studio/releases/platforms
          # for availability first.
          #
          # - api-level: 37
          #   android-version: '17 CinnamonBun'
          #   target: google_apis
          #   arch: x86_64
          #   profile: pixel_6
          #   avd-name: Pixel_6_API_37
          #   detox-config: android.api37.debug

          - api-level: 35
            android-version: '15 VanillaIceCream'
            target: google_apis
            arch: x86_64
            # avdmanager's built-in device list uses id-style names for Pixel
            # devices ("pixel_6"), not the display name ("Pixel 6") — unlike
            # legacy Nexus entries, which really are registered under their
            # display name ("Nexus 5X", used by the API 24 leg below, works
            # as-is). Using the display name here failed every run with
            # "Error: No device found matching --device Pixel 6." — this
            # was also the real cause of the API 37 boot failure flagged in
            # an earlier investigation as unconfirmed/acceleration-related;
            # it wasn't a boot/image issue at all.
            profile: pixel_6
            avd-name: Pixel_6_API_35
            detox-config: android.api35.debug

          - api-level: 33
            android-version: '13 Tiramisu'
            target: google_apis
            arch: x86_64
            # avdmanager's built-in device list uses id-style names for Pixel
            # devices ("pixel_6"), not the display name ("Pixel 6") — unlike
            # legacy Nexus entries, which really are registered under their
            # display name ("Nexus 5X", used by the API 24 leg below, works
            # as-is). Using the display name here failed every run with
            # "Error: No device found matching --device Pixel 6." — this
            # was also the real cause of the API 37 boot failure flagged in
            # an earlier investigation as unconfirmed/acceleration-related;
            # it wasn't a boot/image issue at all.
            profile: pixel_6
            avd-name: Pixel_6_API_33
            detox-config: android.api33.debug

          - api-level: 30
            android-version: '11 R'
            target: google_apis
            arch: x86_64
            # Same id-style-name fix as the pixel_6 entries above.
            profile: pixel_4
            avd-name: Pixel_6_API_30
            detox-config: android.api30.debug

          - api-level: 24
            android-version: '7.0 Nougat'
            target: default       # google_apis x86_64 not available for API 24
            arch: x86
            profile: Nexus 5X
            avd-name: Nexus_5X_API_24
            detox-config: android.api24.debug

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships with a lot of pre-installed toolchains this
      # workflow never touches (.NET, Haskell/GHC, cached Docker images) and
      # starts with well under half its disk free as a result. That was
      # invisible while every Android job failed within seconds — now that
      # AVD creation, a real emulator boot, and a real `assembleRelease`
      # Gradle build all actually run, one leg (API 35) exhausted the disk
      # entirely and crashed the runner process itself ("No space left on
      # device"), and the sibling jobs failed too. Freeing space upfront
      # rather than waiting to hit this again on whichever leg runs biggest.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Setup Python 3.12 (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Backgrounded so it comes up in parallel with the APK/emulator build
      # steps below instead of costing its own dedicated wait. ENVIRONMENT=
      # development makes the app self-provision its schema (inline
      # idempotent migrations in startup.py — no `alembic upgrade` needed,
      # same as backend-tests.yml/docker-compose.yml) and auto-seed the
      # student@test.local / Test1234! account e2e/helpers.js's
      # loginAsStudent() expects. "Wait for backend health" below is the
      # actual sync point.
      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "Backend starting (PID $!)"
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: development

      - name: Enable KVM (Android emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}-${{ matrix.api-level }}

      - name: Build APK for testing
        working-directory: mobile
        run: detox build -c ${{ matrix.detox-config }}
        env:
          # 10.0.2.2 is the Android emulator's fixed alias for the host
          # machine's loopback interface — that's where the backend started
          # above is actually listening. EXPO_PUBLIC_* vars are inlined into
          # the JS bundle at build time (see src/api/client.ts's resolution
          # order comment), so this has to be set here, not at test-run time.
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend/backend.log
          exit 1

      - name: Run Android AVD + Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd-name }}
          working-directory: mobile
          # The emulator is torn down by this action's own internal steps as
          # soon as `script` returns, before the next workflow step ever
          # runs — so a logcat dump has to happen HERE, inside this script,
          # on failure, or the device is already gone by the time we'd try
          # to grab it. "Detox can't seem to connect to the test app(s)!"
          # gives no indication of *why* (crash vs. hang vs. Detox native
          # module misconfigured); a full logcat is the only way to see if
          # the app actually crashed on launch.
          #
          # BUG: this used to be a multi-line `script: |` block with an
          # if/then/fi. This action does NOT run a multi-line script value as
          # one continuous shell script — the log showed each line invoked as
          # its OWN separate `sh -c "<line>"` call ("/usr/bin/sh -c mkdir -p
          # artifacts" then, separately, "/usr/bin/sh -c if ! detox test
          # ...; then"), so the `if` never saw its matching `fi` in the same
          # invocation ("Syntax error: end of file unexpected (expecting
          # \"fi\")"). Collapsed to one single physical line using &&/|| so
          # it can't be split across invocations.
          script: mkdir -p artifacts && (detox test -c ${{ matrix.detox-config }} --headless --record-videos failing --take-screenshots failing || { echo "=== Detox test failed — dumping full logcat for diagnosis ==="; adb logcat -d > artifacts/logcat.txt; exit 1; })
        env:
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload Detox artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-android-api${{ matrix.api-level }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# iOS — matrix across iOS 26 / 18 (iOS 16/17 floor tests are LOCAL-only —
# see mobile/.detoxrc.js's ios.16.debug/ios.17.debug comments and the removed
# entry below for why).
# ──────────────────────────────────────────────────────────────────────────────
  ios-e2e:
    name: iOS ${{ matrix.ios-version }} (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 27 — DISABLED. Confirmed via actions/runner-images directly
          # (macos-15 readme) that no current GitHub-hosted macOS image ships
          # Xcode 27 yet ("Could not find Xcode version that satisfied
          # version spec: '27.0'" on the run that tried it) — this isn't a
          # wrong-version-string problem, Xcode 27 genuinely isn't available
          # on any hosted runner as of writing. .detoxrc.js's ios.27.debug
          # config is left in place; re-add this matrix entry once GitHub
          # actually ships an Xcode 27 image (check
          # https://github.com/actions/runner-images for availability) and
          # fill in the real xcode-version string from that image's readme.
          #
          # iOS 26 — current baseline (~86 % adoption on recent devices).
          # device was iPhone 16, confirmed broken via a "No simulator found"
          # dump: macos-latest rolled forward to Xcode 26.6, whose iOS
          # 26.2/26.4/26.5 runtimes only provision the iPhone 17 lineup +
          # iPhone 16e — the plain iPhone 16/16 Plus/16 Pro/16 Pro Max are
          # gone. Since macos-latest is a moving target, this device pin can
          # break again the same way whenever GitHub next rolls the image's
          # device catalog forward — if it does, re-check via the same
          # "No simulator found... Available devices:" dump this job
          # produces on failure.
          - ios-version: '26'
            runner: macos-latest
            device: iPhone 17
            detox-config: ios.26.debug
            xcode-version: latest-stable

          # iOS 18 — primary fallback for users who skip the latest update.
          # device confirmed via the actual "No simulator found" dump from
          # this runner: macos-15's iOS 18.5/18.6 runtimes only provision
          # iPhone 16 family + iPhone SE (3rd generation) simulators — no
          # iPhone 15 device exists here at all, regardless of the OS
          # version match being correct. Switched to iPhone 16 (also update
          # the matching simulator.ios18 device in mobile/.detoxrc.js).
          - ios-version: '18'
            runner: macos-15
            device: iPhone 16
            detox-config: ios.18.debug
            xcode-version: '16'

          # iOS 16 — REMOVED. Confirmed via an actual CI failure that this leg
          # is structurally impossible, not a device-pin typo like the iOS
          # 18/26 fixes above: getting an iOS 16 simulator runtime requires
          # xcode-version '15' (Xcode 15.4), but this project's React Native
          # version refuses to even generate a Podfile below Xcode 16.1
          # ("React Native requires XCode >= 16.1. Found 15.4. Invalid
          # `Podfile` file: Please upgrade XCode."). No Xcode release
          # satisfies both "ships an iOS 16 runtime" and "is >= 16.1" — Apple
          # dropped iOS 16 from the bundled runtime list once Xcode crossed
          # that line. mobile/.detoxrc.js already anticipated this: its
          # ios.16.debug/ios.17.debug configs are commented "LOCAL: runnable
          # on the Ventura Intel Mac" specifically because they were never
          # meant to run on a CI image. Left those configs in place for local
          # use; just not running them here.

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli

      # Same "no backend was ever started" gap as the Android job — same fix,
      # different mechanics. GitHub-hosted macOS runners don't support
      # Docker/`services:` (no nested virtualization), so this can't reuse
      # the postgres/redis service containers the Android job above uses.
      # Homebrew + a plain backgrounded uvicorn process sidesteps that
      # entirely instead of fighting it.
      - name: Setup Python 3.12 (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Postgres + Redis (Homebrew)
        run: brew install postgresql@16 pgvector redis

      - name: Start Postgres + Redis, create test_db
        run: |
          brew services start postgresql@16
          brew services start redis
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          for i in $(seq 1 30); do
            "$PG_BIN/pg_isready" -h localhost -p 5432 && break
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          "$PG_BIN/createuser" -s test_user
          "$PG_BIN/psql" -d postgres -c "ALTER USER test_user WITH PASSWORD 'test_password';"
          "$PG_BIN/createdb" -O test_user test_db
          # Best-effort: startup.py's own migrations tolerate a missing
          # vector extension (wrapped in a try/except-style SAVEPOINT, same
          # as database/init.sql's DO block) so this isn't fatal if it fails.
          "$PG_BIN/psql" -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector;" || true

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Backgrounded — see the matching comment in the Android job above.
      # "Wait for backend health" later in this job is the actual sync point.
      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo "Backend starting (PID $!)"
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          ENVIRONMENT: development

      - name: Setup Ruby + Bundler (pinned CocoaPods via mobile/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ hashFiles('mobile/ios/Podfile.lock') }}-${{ matrix.ios-version }}
          restore-keys: pods-

      - name: Generate native iOS project (Expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install Pods (pinned CocoaPods via bundle exec)
        working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS app for testing
        working-directory: mobile
        run: detox build -c ${{ matrix.detox-config }}
        env:
          # Unlike the Android emulator, the iOS Simulator shares the Mac
          # host's network directly — localhost:8000 reaches the backend
          # started above (10.0.2.2, which app.json falls back to, is an
          # Android-only alias and isn't a routable address here at all).
          # EXPO_PUBLIC_* vars are inlined into the JS bundle at build time,
          # so this has to be set here, not at test-run time.
          EXPO_PUBLIC_API_URL: http://localhost:8000

      - name: Install applesimutils
        # Detox's iOS test runner shells out to `applesimutils` (a Homebrew
        # CLI wrapper it uses to manage simulators) — it's not preinstalled
        # on GitHub-hosted macOS runners, so every `detox test` invocation
        # fails immediately with "applesimutils: command not found" unless
        # it's installed explicitly first.
        #
        # Installing by short name ("applesimutils") failed on Homebrew
        # >= 6.0.0 with "Refusing to load formula wix/brew/applesimutils
        # from untrusted tap wix/brew" — non-official taps now require
        # explicit trust (docs.brew.sh/Tap-Trust). Installing the
        # fully-qualified name (user/repo/formula) auto-trusts just that
        # one formula without granting blanket trust to the whole tap.
        run: |
          brew tap wix/brew
          brew install wix/brew/applesimutils

      - name: Boot iOS simulator
        # `simctl list devices available`'s plain-text output puts the OS
        # version on its own header line ("-- iOS 26.0 --") and each device
        # on separate lines below it — never both on the same line. The old
        # `grep "$device" | grep "iOS $version"` required a single line to
        # match both, which never happens, so $UDID always came back empty
        # and `simctl boot ""` failed every run. Using the JSON output and
        # jq to actually walk the runtime → device structure fixes this for
        # real, matching on the device name within whichever runtime key
        # contains the target major iOS version (runtime keys look like
        # "com.apple.CoreSimulator.SimRuntime.iOS-26-0" — dashes, not dots).
        run: |
          UDID=$(xcrun simctl list devices available --json | \
            jq -r --arg os "iOS-${{ matrix.ios-version }}" --arg dev "${{ matrix.device }}" \
            '.devices | to_entries[] | select(.key | contains($os)) | .value[] | select(.name == $dev) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "No simulator found matching device '${{ matrix.device }}' on iOS ${{ matrix.ios-version }}. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend/backend.log
          exit 1

      - name: Run Detox tests
        working-directory: mobile
        run: detox test -c ${{ matrix.detox-config }} --headless --record-videos failing --take-screenshots failing
        env:
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload Detox artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-ios${{ matrix.ios-version }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14
