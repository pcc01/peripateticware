name: Mobile E2E (Detox)

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

# ──────────────────────────────────────────────────────────────────────────────
# ANDROID — matrix across API 37 / 35 / 33 / 30 / 24
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  android-e2e:
    name: Android ${{ matrix.android-version }} (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      fail-fast: false          # keep other API levels running if one fails
      matrix:
        include:
          - api-level: 37
            android-version: '17 CinnamonBun'
            target: google_apis
            arch: x86_64
            profile: Pixel 6
            avd-name: Pixel_6_API_37
            detox-config: android.api37.debug

          - api-level: 35
            android-version: '15 VanillaIceCream'
            target: google_apis
            arch: x86_64
            profile: Pixel 6
            avd-name: Pixel_6_API_35
            detox-config: android.api35.debug

          - api-level: 33
            android-version: '13 Tiramisu'
            target: google_apis
            arch: x86_64
            profile: Pixel 6
            avd-name: Pixel_6_API_33
            detox-config: android.api33.debug

          - api-level: 30
            android-version: '11 R'
            target: google_apis
            arch: x86_64
            profile: Pixel 4
            avd-name: Pixel_6_API_30
            detox-config: android.api30.debug

          - api-level: 24
            android-version: '7.0 Nougat'
            target: default       # google_apis x86_64 not available for API 24
            arch: x86
            profile: Nexus 5X
            avd-name: Nexus_5X_API_24
            detox-config: android.api24.debug

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Enable KVM (Android emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}-${{ matrix.api-level }}

      - name: Build APK for testing
        working-directory: mobile
        run: detox build -c ${{ matrix.detox-config }}

      - name: Run Android AVD + Detox tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          avd-name: ${{ matrix.avd-name }}
          working-directory: mobile
          script: detox test -c ${{ matrix.detox-config }} --headless --record-videos failing --take-screenshots failing
        env:
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload Detox artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-android-api${{ matrix.api-level }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14

# ──────────────────────────────────────────────────────────────────────────────
# iOS — matrix across iOS 26 / 18 / 16
# ──────────────────────────────────────────────────────────────────────────────
  ios-e2e:
    name: iOS ${{ matrix.ios-version }} (${{ matrix.device }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 26 — current baseline (~86 % adoption on recent devices)
          - ios-version: '26'
            runner: macos-latest
            device: iPhone 16
            detox-config: ios.26.debug
            xcode-version: latest-stable

          # iOS 18 — primary fallback for users who skip the latest update
          - ios-version: '18'
            runner: macos-15
            device: iPhone 15
            detox-config: ios.18.debug
            xcode-version: '16'

          # iOS 16 — floor (last version for iPhone 8 / iPhone X legacy hardware)
          - ios-version: '16'
            runner: macos-14
            device: iPhone 8
            detox-config: ios.16.debug
            xcode-version: '15'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode-version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Install Detox CLI
        run: npm install -g detox-cli

      - name: Setup Ruby + Bundler (pinned CocoaPods via mobile/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ hashFiles('mobile/ios/Podfile.lock') }}-${{ matrix.ios-version }}
          restore-keys: pods-

      - name: Generate native iOS project (Expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install Pods (pinned CocoaPods via bundle exec)
        working-directory: mobile
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS app for testing
        working-directory: mobile
        run: detox build -c ${{ matrix.detox-config }}

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "${{ matrix.device }}" | grep "iOS ${{ matrix.ios-version }}" | head -1 | grep -E -o '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Run Detox tests
        working-directory: mobile
        run: detox test -c ${{ matrix.detox-config }} --headless --record-videos failing --take-screenshots failing
        env:
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}

      - name: Upload Detox artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detox-ios${{ matrix.ios-version }}-${{ github.run_id }}
          path: mobile/artifacts/
          retention-days: 14
