[pytest]
# Restrict test discovery to tests/. Without this, a bare `pytest` invocation
# from backend/ recursively scans the ENTIRE tree for files matching
# test_*.py / *_test.py -- which previously picked up
# scripts/test_crawler_ingestion.py (a standalone manual diagnostic script,
# not a pytest test). That script stubs out sys.modules['models.compliance']
# and sys.modules['services.privacy_engine'] with bare placeholder objects at
# IMPORT TIME to run offline without a DB. Because pytest collection imports
# every matching file up front, those stubs leaked into the shared sys.modules
# cache for the rest of the session and broke unrelated tests
# (test_breach_notification.py, test_r2_upload.py, test_parent_portal.py)
# with "cannot import name X from Y (unknown location)" ImportErrors whenever
# pytest was run without an explicit `tests/` path argument.
testpaths = tests
